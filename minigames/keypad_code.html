<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter code</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:#e2e8f0;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#162235,#0b1017 70%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,#0000 0 3px,#0000000d 3px 4px),radial-gradient(transparent 55%,#000a)}
.w{width:min(94vw,540px);padding:18px;border:2px solid #334155;border-radius:18px;background:#0f1722cc;box-shadow:0 0 0 4px #0b1017,0 0 40px #5eead422 inset;text-align:center;position:relative}
h1{margin:0 0 4px;font-size:1.3rem;letter-spacing:.2em;color:#5eead4;text-shadow:0 0 12px #5eead488}
.sub{font-size:.8rem;color:#94a3b8;margin-bottom:14px}
#msg{margin-top:12px;min-height:1.6em;font-weight:800;letter-spacing:.06em}
#ban{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:#22c55e33;pointer-events:none}
#ban b{font-size:clamp(1.5rem,6vw,2.5rem);letter-spacing:.2em;padding:16px 28px;border:3px solid #22c55e;background:#052e16ee;border-radius:14px;color:#86efac}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
#note{display:inline-block;background:#fde68a;color:#1f2937;padding:10px 22px;transform:rotate(-3deg);box-shadow:0 6px 14px #0008;font:700 .7rem system-ui;letter-spacing:.15em}#note b{display:block;font:800 2rem "Comic Sans MS",cursive,monospace;letter-spacing:.2em}
#lk{font-size:2rem;margin:10px 0 4px}
.slots{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.sl{width:50px;height:62px;border:3px solid #475569;border-radius:10px;background:#020617;font:800 2rem monospace;display:grid;place-items:center;position:relative}.sl.f{border-color:#5eead4}
.sl.ok{border-color:#22c55e;color:#86efac}.sl.bad{border-color:#ef4444;color:#fca5a5}.sl.ok:after,.sl.bad:after{position:absolute;top:-1px;right:3px;font-size:.75rem}.sl.ok:after{content:"✓"}.sl.bad:after{content:"✕"}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.k button{padding:14px;font-size:1.4rem;font-weight:800;border:0;border-radius:10px;background:#334155;color:#e2e8f0;box-shadow:0 5px 0 #1e293b;transition:transform .08s,box-shadow .08s;touch-action:manipulation}.k button:active{transform:translateY(4px);box-shadow:0 1px 0 #1e293b;background:#475569}
</style></head><body><div id="ban"></div>
<div class="w"><h1>ENTER CODE</h1><div class="sub">Copy the code from the note (keyboard works too)</div><div id="note">DOOR CODE<b></b></div><div id="lk">🔒</div>
<div class="slots" id="slots"></div><div class="k" id="k"></div><div id="msg" aria-live="polite"></div></div>
<script>
const $=s=>document.querySelector(s),RM=matchMedia("(prefers-reduced-motion: reduce)").matches,R=(a,b)=>a+Math.random()*(b-a),W=$(".w");
function shake(el=W,n=9){if(RM)return;el.animate([{transform:`translate(${n}px,0)`},{transform:`translate(${-n}px,${n/3}px)`},{transform:`translate(${n/2}px,${-n/3}px)`},{transform:`translate(${-n/3}px,0)`},{transform:"none"}],{duration:300,easing:"ease-out"})}
function pop(x,y,t,c="#5eead4"){const e=document.createElement("div");e.textContent=t;e.style.cssText=`position:fixed;left:${x}px;top:${y}px;color:${c};font:800 20px system-ui;text-shadow:0 2px 0 #000,0 0 8px #000;pointer-events:none;z-index:9`;document.body.append(e);e.animate([{transform:"translate(-50%,0) scale(.5)",opacity:0},{transform:"translate(-50%,-18px) scale(1.25)",opacity:1,offset:.25},{transform:"translate(-50%,-56px) scale(1)",opacity:0}],{duration:800,easing:"ease-out"}).onfinish=()=>e.remove()}
function burst(x,y,c="#5eead4",n=16){if(RM)n=4;for(let i=0;i<n;i++){const e=document.createElement("i"),a=R(0,6.28),d=R(30,90),s=R(4,9);e.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c};border-radius:${i%2?"50%":"2px"};pointer-events:none;z-index:9`;document.body.append(e);e.animate([{transform:"translate(-50%,-50%)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d+25}px)) rotate(${R(-360,360)}deg)`,opacity:0}],{duration:R(450,800),easing:"cubic-bezier(.1,.7,.3,1)"}).onfinish=()=>e.remove()}}
function msg(t,c="#5eead4"){const m=$("#msg");m.textContent=t;m.style.color=c}
let _w=0;function win(t="TASK COMPLETE"){if(_w)return;_w=1;const b=$("#ban");b.innerHTML="<b>✓ "+t+"</b>";b.style.display="grid";b.animate([{opacity:0,transform:"scale(1.3)"},{opacity:1,transform:"none"}],{duration:300,easing:"ease-out",fill:"forwards"});window.completeTask&&window.completeTask(1500)}
const code=String(Math.floor(10000+Math.random()*90000));$("#note b").textContent=code.split("").join(" ");
let v="",lock=false;const slots=$("#slots"),sl=[];
for(let i=0;i<5;i++){const s=document.createElement("div");s.className="sl";slots.append(s);sl.push(s)}
const draw=()=>sl.forEach((s,i)=>{s.className="sl"+(v[i]?" f":"");s.textContent=v[i]||""});
function key(k){if(lock)return;if(k==="C")v="";else if(k==="B")v=v.slice(0,-1);else if(v.length<5){v+=k;draw();sl[v.length-1].animate([{transform:"scale(1.3)"},{transform:"none"}],{duration:180})}draw();if(v.length===5)check()}
function check(){lock=true;setTimeout(()=>{
 if(v===code){sl.forEach((s,i)=>setTimeout(()=>{s.classList.add("ok");const r=s.getBoundingClientRect();burst(r.left+25,r.top+30,"#22c55e",6)},i*90));$("#lk").textContent="🔓";msg("✓ Access granted");setTimeout(()=>win("ACCESS GRANTED"),500)}
 else{sl.forEach(s=>s.classList.add("bad"));shake();msg("✕ Wrong code","#f87171");$("#lk").animate([{transform:"rotate(-14deg)"},{transform:"rotate(14deg)"},{transform:"none"}],{duration:240,iterations:2});setTimeout(()=>{v="";draw();lock=false;msg("")},750)}},180)}
["1","2","3","4","5","6","7","8","9","C","0","B"].forEach(s=>{const b=document.createElement("button");b.type="button";b.textContent=s==="B"?"⌫":s;b.setAttribute("aria-label",s==="B"?"Backspace":s==="C"?"Clear":s);b.onpointerdown=e=>{e.preventDefault();key(s)};$("#k").append(b)});
addEventListener("keydown",e=>{if(/^\d$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("B");else if(e.key==="Escape"||e.key==="Delete")key("C")});
</script></body></html>
