<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="location" content="Hangar">
<title>Hull repair</title>
<style>
  :root{
    --panel-dark:#242527; --panel-mid:#2f3033; --panel-light:#3c3d41; --bezel:#0e0e10;
    --caution-yellow:#f2c14e; --caution-black:#1a1a1c;
    --text-label:#d3d4d9; --text-dim:#8d8e93;
    --screen:#0d1a22; --screen-text:#7fd8ff; --screen-dim:#3f6f86;
    --good:#3ddc63; --warn:#ffb35a; --bad:#ff5a4a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 0%, #2a2a2e 0%, #131315 60%, #0a0a0b 100%);
    font-family:'Arial Narrow', Arial, Helvetica, sans-serif; color:var(--text-label);
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  .panel{
    position:relative; width:100%; max-width:560px;
    background:
      repeating-linear-gradient(100deg, var(--panel-mid) 0 2px, var(--panel-light) 3px, var(--panel-mid) 4px),
      linear-gradient(180deg, var(--panel-light), var(--panel-dark));
    border-radius:14px; padding:18px 20px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px var(--bezel), inset 0 0 0 8px #050506;
    transition:box-shadow .5s;
  }
  .panel.done{ box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 34px rgba(61,220,99,.35), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px #1b6b30, inset 0 0 0 8px #050506; }
  .panel.shake{ animation:shake .32s linear; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(2px); }
  }
  .rivet{ position:absolute; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eceef0, #a7a8ad 45%, #5f6065 80%);
    box-shadow:0 1px 2px rgba(0,0,0,.8), inset 0 0 2px rgba(0,0,0,.6); }
  .rivet.tl{ top:14px; left:14px; } .rivet.tr{ top:14px; right:14px; }
  .rivet.bl{ bottom:14px; left:14px; } .rivet.br{ bottom:14px; right:14px; }
  .caution{ height:9px; border-radius:3px; margin:0 18px 10px;
    background:repeating-linear-gradient(-45deg, var(--caution-yellow) 0 10px, var(--caution-black) 10px 20px); }
  h1{ margin:0 0 10px; text-align:center; font-size:clamp(18px, 5vw, 24px); letter-spacing:3px; color:#eceef0; text-shadow:0 2px 0 #000; }
  .screen{
    position:relative; border-radius:8px; padding:10px 12px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at 50% 40%, #12303d, var(--screen) 75%);
    box-shadow:inset 0 0 0 3px #050506, inset 0 0 24px rgba(0,0,0,.8);
    color:var(--screen-text);
  }
  .status{ margin-top:12px; min-height:34px; text-align:center; padding:6px 10px; border-radius:6px;
    background:#151617; box-shadow:inset 0 2px 5px rgba(0,0,0,.8);
    font-family:'Courier New', monospace; font-weight:700; letter-spacing:1px; font-size:clamp(13px, 3.8vw, 16px); color:var(--screen-text); }
  .status.warn{ color:var(--warn); }
  .status.good{ color:var(--good); }
  .flash{ position:fixed; inset:0; pointer-events:none; opacity:0; z-index:50; }
  .flash.good{ background:#3ddc63; animation:flash .5s ease-out; }
  .flash.bad{ background:#ff5a4a; animation:flashb .3s ease-out; }
  @keyframes flash{ 0%{ opacity:0; } 30%{ opacity:.5; } 100%{ opacity:0; } }
  @keyframes flashb{ 0%{ opacity:0; } 30%{ opacity:.22; } 100%{ opacity:0; } }
  @media (max-height:430px){
    .panel{ padding:10px 16px 10px; }
    h1{ font-size:17px; margin-bottom:6px; } .caution{ margin-bottom:6px; }
    .status{ margin-top:6px; min-height:28px; padding:4px 8px; }
  }
  @media (prefers-reduced-motion:reduce){
    .panel.shake{ animation:none; }
    .flash.good, .flash.bad{ animation-duration:.01s; }
  }

  /* ---- this game ---- */
  .lamps{ display:flex; justify-content:center; gap:10px; margin-bottom:10px; }
  .lamps i{ width:14px; height:14px; border-radius:50%; background:#3a1d14; box-shadow:inset 0 0 0 2px #1a0d09; transition:background .2s, box-shadow .2s; }
  .lamps i.on{ background:var(--good); box-shadow:0 0 8px rgba(61,220,99,.7); }
  .plate{ position:relative; height:clamp(220px, 46vh, 330px); border-radius:8px; overflow:hidden; touch-action:none; cursor:crosshair;
    box-shadow:inset 0 0 0 3px #050506; }
  .plate canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  @media (max-height:430px){ .plate{ height:calc(100vh - 175px); min-height:150px; } .lamps{ margin-bottom:6px; } }

</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="panel" id="panel">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="caution"></div>
    <h1>HULL REPAIR</h1>
    <div class="lamps" id="lamps"></div>
    <div class="plate" id="plate"><canvas id="cv" aria-label="Hull plate with cracks. Trace each crack to weld it."></canvas></div>
    <div class="status" id="status" role="status" aria-live="polite">Trace the cracks</div>
  </div>
<script>
(function(){
  var panel = document.getElementById('panel');
  var statusEl = document.getElementById('status');
  var flashEl = document.getElementById('flash');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function vibrate(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function setStatus(text, kind){
    var cls = 'status' + (kind ? ' ' + kind : '');
    if (statusEl.textContent === text && statusEl.className === cls) return;
    statusEl.textContent = text; statusEl.className = cls;
  }
  function doFlash(kind){ flashEl.className = 'flash'; void flashEl.offsetWidth; flashEl.className = 'flash ' + kind; }
  function shakePanel(){ panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake'); }
  var finished = false;
  // Finishing: the frame glows green and the task is reported; no banner or remarks.
  function finish(){
    if (finished) return;
    finished = true;
    panel.classList.add('done');
    setStatus('✓', 'good');
    doFlash('good');
    vibrate(40);
    if (window.completeTask) window.completeTask(1500);
  }

  // ---- this game ----
  var CRACKS = 4;
  var REACH = 18;           // torch reach in px
  var HEAT_NEEDED = 0.16;   // seconds of torch on a spot to weld it (keeps the trace slow and deliberate)
  var DONE_AT = 0.93;       // share of a crack that counts as welded (the last bits fill in)
  var plate = document.getElementById('plate'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var lampsEl = document.getElementById('lamps');
  for (var l = 0; l < CRACKS; l++) lampsEl.appendChild(document.createElement('i'));

  var W = 0, H = 0, DPR = 1, bg = null;
  // Cracks are stored in 0..1 plate units so a resize keeps them in place.
  var cracks = [];
  (function makeCracks(){
    for (var k = 0; k < CRACKS; k++){
      var bandY = (k + 0.5) / CRACKS, bandH = 1 / CRACKS;
      var x0 = rnd(0.07, 0.22), x1 = rnd(0.78, 0.93), segs = 9 + Math.floor(Math.random() * 4);
      var pts = [];
      for (var s = 0; s <= segs; s++){
        var u = s / segs;
        pts.push([x0 + (x1 - x0) * u + rnd(-0.015, 0.015), bandY + (s === 0 || s === segs ? rnd(-0.12, 0.12) : rnd(-0.32, 0.32)) * bandH]);
      }
      if (Math.random() < 0.5) pts.reverse();
      cracks.push({ pts:pts, samples:[], done:false });
    }
  })();
  function resample(){
    // weld spots every ~5 px along each crack
    cracks.forEach(function(c){
      var old = c.samples; c.samples = [];
      for (var i = 0; i < c.pts.length - 1; i++){
        var ax = c.pts[i][0] * W, ay = c.pts[i][1] * H, bx = c.pts[i + 1][0] * W, by = c.pts[i + 1][1] * H;
        var n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / 5));
        for (var j = 0; j < n; j++) c.samples.push({ u:i + j / n, x:ax + (bx - ax) * j / n, y:ay + (by - ay) * j / n, heat:0, welded:false, t:0 });
      }
      // keep progress across a resize
      if (old.length){ old.forEach(function(o){ if (!o.welded) return; var m = c.samples.reduce(function(best, s){ return Math.abs(s.u - o.u) < Math.abs(best.u - o.u) ? s : best; }); m.welded = true; m.t = o.t; }); }
    });
  }
  function paintPlate(){
    bg = document.createElement('canvas'); bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
    var g = bg.getContext('2d'); g.scale(DPR, DPR);
    var lg = g.createLinearGradient(0, 0, W, H); lg.addColorStop(0, '#5a5d63'); lg.addColorStop(0.5, '#43464b'); lg.addColorStop(1, '#34363a');
    g.fillStyle = lg; g.fillRect(0, 0, W, H);
    g.globalAlpha = 0.06; g.fillStyle = '#fff';
    for (var y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
    for (var rx = 14; rx < W; rx += (W - 28) / 6){ [10, H - 10].forEach(function(ry){ g.fillStyle = '#2a2b2e'; g.beginPath(); g.arc(rx, ry, 4, 0, 6.283); g.fill(); g.fillStyle = '#7a7d83'; g.beginPath(); g.arc(rx - 1, ry - 1, 2.2, 0, 6.283); g.fill(); }); }
  }
  function measure(){
    W = plate.clientWidth; H = plate.clientHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    resample(); paintPlate();
  }

  var torch = { on:false, x:0, y:0, speed:0, lx:0, ly:0, lt:0 };
  function pos(e){ var r = plate.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  plate.addEventListener('pointerdown', function(e){
    if (finished) return;
    e.preventDefault(); try{ plate.setPointerCapture(e.pointerId); }catch(err){}
    var p = pos(e); torch.on = true; torch.x = torch.lx = p[0]; torch.y = torch.ly = p[1]; torch.lt = performance.now(); torch.speed = 0;
  });
  plate.addEventListener('pointermove', function(e){
    if (!torch.on) return;
    var p = pos(e), now = performance.now(), dt = Math.max(1, now - torch.lt) / 1000;
    var v = Math.hypot(p[0] - torch.lx, p[1] - torch.ly) / dt;
    torch.speed += (v - torch.speed) * 0.3;
    torch.x = p[0]; torch.y = p[1]; torch.lx = p[0]; torch.ly = p[1]; torch.lt = now;
  });
  function off(){ torch.on = false; }
  plate.addEventListener('pointerup', off); plate.addEventListener('pointercancel', off);

  var sparks = [], tooFast = 0, last = performance.now(), clock = 0, buzz = 0;
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
    if (torch.on && !finished){
      var weldedNow = 0;
      cracks.forEach(function(c, ci){
        if (c.done) return;
        var count = 0;
        c.samples.forEach(function(s){
          if (!s.welded && Math.abs(s.x - torch.x) < REACH && Math.abs(s.y - torch.y) < REACH && Math.hypot(s.x - torch.x, s.y - torch.y) < REACH){
            s.heat += dt;
            if (s.heat >= HEAT_NEEDED){ s.welded = true; s.t = clock; weldedNow++; }
          }
          if (s.welded) count++;
        });
        if (count / c.samples.length >= DONE_AT){
          c.done = true; c.samples.forEach(function(s){ if (!s.welded){ s.welded = true; s.t = clock; } });
          lampsEl.children[ci].classList.add('on'); vibrate(25);
          if (cracks.every(function(x){ return x.done; })) finish();
        }
      });
      if (weldedNow && sparks.length < 160){
        for (var i = 0; i < 3; i++) sparks.push({ x:torch.x, y:torch.y, vx:rnd(-90, 90), vy:rnd(-160, -30), life:rnd(0.25, 0.55), age:0 });
        buzz += dt; if (buzz > 0.12){ buzz = 0; vibrate(3); }
      }
      // moving too fast to weld: say so after a moment
      tooFast = torch.speed > 420 ? tooFast + dt : Math.max(0, tooFast - dt * 2);
      if (!finished) setStatus(tooFast > 0.35 ? 'Slower - let it weld' : 'Trace the cracks', tooFast > 0.35 ? 'warn' : null);
    } else if (!finished){ setStatus('Trace the cracks'); }
    for (var k = sparks.length - 1; k >= 0; k--){ var p = sparks[k]; p.age += dt; p.vy += 520 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.age > p.life) sparks.splice(k, 1); }
    draw();
    requestAnimationFrame(frame);
  }
  function draw(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (bg) ctx.drawImage(bg, 0, 0, W, H);
    cracks.forEach(function(c){
      // the open crack
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(255,90,40,.18)'; ctx.lineWidth = 9;
      ctx.beginPath(); c.pts.forEach(function(p, i){ var x = p[0] * W, y = p[1] * H; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }); ctx.stroke();
      ctx.strokeStyle = '#121214'; ctx.lineWidth = 3; ctx.stroke();
      // weld beads: glowing hot, cooling to steel
      c.samples.forEach(function(s){
        if (!s.welded && s.heat <= 0) return;
        if (s.welded){
          var age = clock - s.t, hot = clamp(1 - age / 1.4, 0, 1);
          ctx.fillStyle = hot > 0 ? 'rgb(' + Math.round(140 + 115 * hot) + ',' + Math.round(140 + 30 * hot) + ',' + Math.round(150 - 110 * hot) + ')' : '#8c9097';
          ctx.beginPath(); ctx.arc(s.x, s.y, 4.2, 0, 6.283); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(255,170,60,' + (0.25 + 0.6 * s.heat / HEAT_NEEDED).toFixed(2) + ')';
          ctx.beginPath(); ctx.arc(s.x, s.y, 3, 0, 6.283); ctx.fill();
        }
      });
    });
    sparks.forEach(function(p){ ctx.fillStyle = 'rgba(255,' + Math.round(200 - 120 * p.age / p.life) + ',80,' + (1 - p.age / p.life).toFixed(2) + ')'; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); });
    if (torch.on && !finished){
      var gr = ctx.createRadialGradient(torch.x, torch.y, 0, torch.x, torch.y, REACH + 6);
      gr.addColorStop(0, 'rgba(230,245,255,.95)'); gr.addColorStop(0.3, 'rgba(120,190,255,.55)'); gr.addColorStop(1, 'rgba(80,140,255,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(torch.x, torch.y, REACH + 6, 0, 6.283); ctx.fill();
    }
  }
  measure();
  window.addEventListener('resize', measure);
  // QA hook for automated tests: ?qa=1 exposes the cracks.
  if (/[?&]qa=1/.test(location.search)) window.__hull = { cracks:function(){ return cracks; }, plate:plate };
  requestAnimationFrame(function(n){ last = n; frame(n); });

})();
</script>
</body>
</html>
