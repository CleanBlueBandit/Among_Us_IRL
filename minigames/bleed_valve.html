<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="location" content="Life support">
<title>Bleed valve</title>
<style>
  :root{
    --panel-dark:#242527; --panel-mid:#2f3033; --panel-light:#3c3d41; --bezel:#0e0e10;
    --caution-yellow:#f2c14e; --caution-black:#1a1a1c;
    --text-label:#d3d4d9; --text-dim:#8d8e93;
    --screen:#0d1a22; --screen-text:#7fd8ff; --screen-dim:#3f6f86;
    --good:#3ddc63; --warn:#ffb35a; --bad:#ff5a4a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 0%, #2a2a2e 0%, #131315 60%, #0a0a0b 100%);
    font-family:'Arial Narrow', Arial, Helvetica, sans-serif; color:var(--text-label);
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  .panel{
    position:relative; width:100%; max-width:560px;
    background:
      repeating-linear-gradient(100deg, var(--panel-mid) 0 2px, var(--panel-light) 3px, var(--panel-mid) 4px),
      linear-gradient(180deg, var(--panel-light), var(--panel-dark));
    border-radius:14px; padding:18px 20px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px var(--bezel), inset 0 0 0 8px #050506;
    transition:box-shadow .5s;
  }
  .panel.done{ box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 34px rgba(61,220,99,.35), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px #1b6b30, inset 0 0 0 8px #050506; }
  .panel.shake{ animation:shake .32s linear; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(2px); }
  }
  .rivet{ position:absolute; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eceef0, #a7a8ad 45%, #5f6065 80%);
    box-shadow:0 1px 2px rgba(0,0,0,.8), inset 0 0 2px rgba(0,0,0,.6); }
  .rivet.tl{ top:14px; left:14px; } .rivet.tr{ top:14px; right:14px; }
  .rivet.bl{ bottom:14px; left:14px; } .rivet.br{ bottom:14px; right:14px; }
  .caution{ height:9px; border-radius:3px; margin:0 18px 10px;
    background:repeating-linear-gradient(-45deg, var(--caution-yellow) 0 10px, var(--caution-black) 10px 20px); }
  h1{ margin:0 0 10px; text-align:center; font-size:clamp(18px, 5vw, 24px); letter-spacing:3px; color:#eceef0; text-shadow:0 2px 0 #000; }
  .screen{
    position:relative; border-radius:8px; padding:10px 12px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at 50% 40%, #12303d, var(--screen) 75%);
    box-shadow:inset 0 0 0 3px #050506, inset 0 0 24px rgba(0,0,0,.8);
    color:var(--screen-text);
  }
  .status{ margin-top:12px; min-height:34px; text-align:center; padding:6px 10px; border-radius:6px;
    background:#151617; box-shadow:inset 0 2px 5px rgba(0,0,0,.8);
    font-family:'Courier New', monospace; font-weight:700; letter-spacing:1px; font-size:clamp(13px, 3.8vw, 16px); color:var(--screen-text); }
  .status.warn{ color:var(--warn); }
  .status.good{ color:var(--good); }
  .flash{ position:fixed; inset:0; pointer-events:none; opacity:0; z-index:50; }
  .flash.good{ background:#3ddc63; animation:flash .5s ease-out; }
  .flash.bad{ background:#ff5a4a; animation:flashb .3s ease-out; }
  @keyframes flash{ 0%{ opacity:0; } 30%{ opacity:.5; } 100%{ opacity:0; } }
  @keyframes flashb{ 0%{ opacity:0; } 30%{ opacity:.22; } 100%{ opacity:0; } }
  @media (max-height:430px){
    .panel{ padding:10px 16px 10px; }
    h1{ font-size:17px; margin-bottom:6px; } .caution{ margin-bottom:6px; }
    .status{ margin-top:6px; min-height:28px; padding:4px 8px; }
  }
  @media (prefers-reduced-motion:reduce){
    .panel.shake{ animation:none; }
    .flash.good, .flash.bad{ animation-duration:.01s; }
  }

  /* ---- this game ---- */
  .gauge-screen{ padding:8px 12px 2px; }
  #gauge{ display:block; width:100%; height:auto; max-height:30vh; margin:0 auto; }
  .wheel-area{ display:flex; justify-content:center; padding:14px 0 2px; }
  .wheel{ position:relative; width:min(54vw, 210px); aspect-ratio:1; touch-action:none; cursor:grab; border-radius:50%; }
  .wheel:active{ cursor:grabbing; }
  .wheel:focus-visible{ outline:3px solid #fff; outline-offset:4px; }
  .wheel.hint{ animation:wheelhint 1.8s ease-in-out infinite; }
  @keyframes wheelhint{ 0%,60%,100%{ transform:rotate(0); } 30%{ transform:rotate(16deg); } }
  .rot{ position:absolute; inset:0; will-change:transform; }
  .rim{ position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, transparent 61%, #7c1a0c 62%, #d9483a 69%, #a8281a 75%, #6a1509 80%, transparent 81%);
    filter:drop-shadow(0 5px 6px rgba(0,0,0,.6)); }
  .spoke{ position:absolute; left:50%; top:50%; width:74%; height:9%; margin-left:-37%; margin-top:-4.5%; border-radius:6px;
    background:linear-gradient(180deg, #d9483a, #8a1e12); box-shadow:0 2px 3px rgba(0,0,0,.5); }
  .hub{ position:absolute; left:50%; top:50%; width:24%; height:24%; margin:-12% 0 0 -12%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eceef0, #a7a8ad 45%, #5f6065 85%); box-shadow:0 2px 6px rgba(0,0,0,.6); }
  .grip{ position:absolute; left:50%; top:2.5%; width:12%; height:12%; margin-left:-6%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd2c4, #d9483a 60%, #6a1509); }
  @media (max-height:430px){ .wheel{ width:min(30vh, 150px); } #gauge{ max-height:26vh; } .wheel-area{ padding-top:8px; } }
  @media (prefers-reduced-motion:reduce){ .wheel.hint{ animation:none; } }

</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="panel" id="panel">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="caution"></div>
    <h1>BLEED VALVE</h1>
    <div class="screen gauge-screen">
      <svg id="gauge" viewBox="0 0 200 118" aria-hidden="true">
        <path id="arcBg" fill="none" stroke="#1f3a47" stroke-width="12"/>
        <path id="arcRed" fill="none" stroke="rgba(255,90,74,.55)" stroke-width="12"/>
        <path id="band" fill="none" stroke="#2f9e4f" stroke-width="14"/>
        <g id="ticks" stroke="#3f6f86" stroke-width="2"></g>
        <path id="mark" fill="#3ddc63"/>
        <line id="needle" x1="100" y1="104" x2="100" y2="30" stroke="#e8f8ff" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="100" cy="104" r="8" fill="#a7a8ad" stroke="#5f6065" stroke-width="2"/>
      </svg>
    </div>
    <div class="wheel-area">
      <div class="wheel hint" id="wheel" role="slider" tabindex="0" aria-label="Valve wheel. Turn clockwise to let pressure out." aria-valuemin="0" aria-valuemax="100">
        <div class="rot" id="rot">
          <div class="rim"></div>
          <div class="spoke"></div><div class="spoke" style="transform:rotate(60deg)"></div><div class="spoke" style="transform:rotate(120deg)"></div>
          <div class="hub"></div><div class="grip"></div>
        </div>
      </div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">Turn the wheel</div>
  </div>
<script>
(function(){
  var panel = document.getElementById('panel');
  var statusEl = document.getElementById('status');
  var flashEl = document.getElementById('flash');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function vibrate(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function setStatus(text, kind){
    var cls = 'status' + (kind ? ' ' + kind : '');
    if (statusEl.textContent === text && statusEl.className === cls) return;
    statusEl.textContent = text; statusEl.className = cls;
  }
  function doFlash(kind){ flashEl.className = 'flash'; void flashEl.offsetWidth; flashEl.className = 'flash ' + kind; }
  function shakePanel(){ panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake'); }
  var finished = false;
  // Finishing: the frame glows green and the task is reported; no banner or remarks.
  function finish(){
    if (finished) return;
    finished = true;
    panel.classList.add('done');
    setStatus('✓', 'good');
    doFlash('good');
    vibrate(40);
    if (window.completeTask) window.completeTask(1500);
  }

  // ---- this game ----
  var PER_TURN = 30;        // pressure let out per full clockwise turn
  var CREEP = 1.6;          // pressure builds back up by this much per second
  var HOLD_NEEDED = 0.8;    // seconds the needle must stay in the green band
  var CX = 100, CY = 104, R = 82;
  var gauge = document.getElementById('gauge'), needle = document.getElementById('needle');
  var band = document.getElementById('band'), wheel = document.getElementById('wheel'), rot = document.getElementById('rot');

  function pt(v, r){ var th = Math.PI * (1 - v / 100); return [CX + r * Math.cos(th), CY - r * Math.sin(th)]; }
  function arc(v1, v2, r){ var a = pt(v1, r), b = pt(v2, r);
    return 'M' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' A' + r + ' ' + r + ' 0 0 1 ' + b[0].toFixed(1) + ' ' + b[1].toFixed(1); }

  var target = rnd(26, 52), HALF = 7;
  document.getElementById('arcBg').setAttribute('d', arc(0, 100, R));
  document.getElementById('arcRed').setAttribute('d', arc(76, 100, R));
  band.setAttribute('d', arc(target - HALF, target + HALF, R));
  var ticks = document.getElementById('ticks');
  for (var v = 0; v <= 100; v += 10){
    var a = pt(v, R - 13), b = pt(v, R - 5), l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', a[0]); l.setAttribute('y1', a[1]); l.setAttribute('x2', b[0]); l.setAttribute('y2', b[1]);
    ticks.appendChild(l);
  }
  // a small arrow over the band, so the target isn't shown by colour alone
  var m = pt(target, R + 9), th = Math.PI * (1 - target / 100), nx = Math.cos(th), ny = -Math.sin(th);
  var px = -ny, py = nx;
  document.getElementById('mark').setAttribute('d', 'M' + (m[0] - nx * 6).toFixed(1) + ' ' + (m[1] - ny * 6).toFixed(1) +
    ' L' + (m[0] + px * 5 + nx * 2).toFixed(1) + ' ' + (m[1] + py * 5 + ny * 2).toFixed(1) +
    ' L' + (m[0] - px * 5 + nx * 2).toFixed(1) + ' ' + (m[1] - py * 5 + ny * 2).toFixed(1) + 'Z');

  var pressure = 92, shown = 92, angle = 0, hold = 0, tickAcc = 0, touched = false;
  function turn(deg){
    if (finished) return;
    if (!touched){ touched = true; wheel.classList.remove('hint'); }
    angle += deg;
    pressure = clamp(pressure - deg / 360 * PER_TURN, 0, 100);
    tickAcc += Math.abs(deg);
    if (tickAcc > 30){ tickAcc = 0; vibrate(4); }
  }

  var dragging = false, lastA = 0;
  function angleOf(e){ var r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)); }
  wheel.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try{ wheel.setPointerCapture(e.pointerId); }catch(err){}
    dragging = true; lastA = angleOf(e);
  });
  wheel.addEventListener('pointermove', function(e){
    if (!dragging) return;
    var a = angleOf(e), d = a - lastA;
    if (d > Math.PI) d -= 2 * Math.PI; else if (d < -Math.PI) d += 2 * Math.PI;
    lastA = a;
    turn(d * 180 / Math.PI);
  });
  function stop(){ dragging = false; }
  wheel.addEventListener('pointerup', stop); wheel.addEventListener('pointercancel', stop);
  wheel.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); turn(9); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); turn(-9); }
  });

  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!finished && touched) pressure = clamp(pressure + CREEP * dt, 0, 100);
    shown += (pressure - shown) * (1 - Math.exp(-12 * dt));
    var tip = pt(shown, R - 18);
    needle.setAttribute('x2', tip[0].toFixed(1)); needle.setAttribute('y2', tip[1].toFixed(1));
    rot.style.transform = 'rotate(' + angle + 'deg)';
    wheel.setAttribute('aria-valuenow', Math.round(shown));
    var inBand = Math.abs(shown - target) <= HALF;
    band.setAttribute('stroke', inBand ? '#3ddc63' : '#2f9e4f');
    needle.setAttribute('stroke', inBand ? '#a7f5b4' : '#e8f8ff');
    if (!finished){
      if (inBand){ hold += dt; setStatus('Hold it there'); if (hold >= HOLD_NEEDED) finish(); }
      else { hold = 0; setStatus(touched && shown < target ? 'Too low - turn back' : 'Turn the wheel', touched && shown < target ? 'warn' : null); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(t){ last = t; frame(t); });

})();
</script>
</body>
</html>
