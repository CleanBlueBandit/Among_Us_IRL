<!DOCTYPE html>
<!-- Copy this file, rename it (the file name becomes the task id) and drop the "_" prefix.
     The meta tag below is the task's default location. A "location" in tasks.json overrides it.
     Call window.completeTask() when the player has finished; the server then marks the task done. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="location" content="Somewhere in the building">
<title>New task</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1017; color: #e2e8f0; font-family: system-ui, sans-serif; }
  button { padding: 14px 28px; font-size: 1.1rem; font-weight: 700; border: 0; border-radius: 12px; background: #5eead4; color: #06201a; }
</style>
</head>
<body>
  <button onclick="this.disabled = true; window.completeTask()">Finish task</button>
</body>
</html>
