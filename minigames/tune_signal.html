<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="location" content="Radio room">
<title>Signal tuner</title>
<style>
  :root{
    --panel-dark:#242527; --panel-mid:#2f3033; --panel-light:#3c3d41; --bezel:#0e0e10;
    --caution-yellow:#f2c14e; --caution-black:#1a1a1c;
    --text-label:#d3d4d9; --text-dim:#8d8e93;
    --screen:#0d1a22; --screen-text:#7fd8ff; --screen-dim:#3f6f86;
    --good:#3ddc63; --warn:#ffb35a; --bad:#ff5a4a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 0%, #2a2a2e 0%, #131315 60%, #0a0a0b 100%);
    font-family:'Arial Narrow', Arial, Helvetica, sans-serif; color:var(--text-label);
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  .panel{
    position:relative; width:100%; max-width:560px;
    background:
      repeating-linear-gradient(100deg, var(--panel-mid) 0 2px, var(--panel-light) 3px, var(--panel-mid) 4px),
      linear-gradient(180deg, var(--panel-light), var(--panel-dark));
    border-radius:14px; padding:18px 20px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px var(--bezel), inset 0 0 0 8px #050506;
    transition:box-shadow .5s;
  }
  .panel.done{ box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 34px rgba(61,220,99,.35), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px #1b6b30, inset 0 0 0 8px #050506; }
  .panel.shake{ animation:shake .32s linear; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(2px); }
  }
  .rivet{ position:absolute; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eceef0, #a7a8ad 45%, #5f6065 80%);
    box-shadow:0 1px 2px rgba(0,0,0,.8), inset 0 0 2px rgba(0,0,0,.6); }
  .rivet.tl{ top:14px; left:14px; } .rivet.tr{ top:14px; right:14px; }
  .rivet.bl{ bottom:14px; left:14px; } .rivet.br{ bottom:14px; right:14px; }
  .caution{ height:9px; border-radius:3px; margin:0 18px 10px;
    background:repeating-linear-gradient(-45deg, var(--caution-yellow) 0 10px, var(--caution-black) 10px 20px); }
  h1{ margin:0 0 10px; text-align:center; font-size:clamp(18px, 5vw, 24px); letter-spacing:3px; color:#eceef0; text-shadow:0 2px 0 #000; }
  .screen{
    position:relative; border-radius:8px; padding:10px 12px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at 50% 40%, #12303d, var(--screen) 75%);
    box-shadow:inset 0 0 0 3px #050506, inset 0 0 24px rgba(0,0,0,.8);
    color:var(--screen-text);
  }
  .status{ margin-top:12px; min-height:34px; text-align:center; padding:6px 10px; border-radius:6px;
    background:#151617; box-shadow:inset 0 2px 5px rgba(0,0,0,.8);
    font-family:'Courier New', monospace; font-weight:700; letter-spacing:1px; font-size:clamp(13px, 3.8vw, 16px); color:var(--screen-text); }
  .status.warn{ color:var(--warn); }
  .status.good{ color:var(--good); }
  .flash{ position:fixed; inset:0; pointer-events:none; opacity:0; z-index:50; }
  .flash.good{ background:#3ddc63; animation:flash .5s ease-out; }
  .flash.bad{ background:#ff5a4a; animation:flashb .3s ease-out; }
  @keyframes flash{ 0%{ opacity:0; } 30%{ opacity:.5; } 100%{ opacity:0; } }
  @keyframes flashb{ 0%{ opacity:0; } 30%{ opacity:.22; } 100%{ opacity:0; } }
  @media (max-height:430px){
    .panel{ padding:10px 16px 10px; }
    h1{ font-size:17px; margin-bottom:6px; } .caution{ margin-bottom:6px; }
    .status{ margin-top:6px; min-height:28px; padding:4px 8px; }
  }
  @media (prefers-reduced-motion:reduce){
    .panel.shake{ animation:none; }
    .flash.good, .flash.bad{ animation-duration:.01s; }
  }

  /* ---- this game ---- */
  #scope{ display:block; width:100%; height:clamp(110px, 26vh, 170px); }
  .ctrl{ display:flex; align-items:center; gap:10px; margin-top:12px; }
  .ctrl .lbl{ width:40px; font-size:11px; letter-spacing:2px; color:var(--text-dim); }
  .track{ position:relative; flex:1; height:46px; border-radius:10px; touch-action:none; cursor:pointer;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(0,0,0,0) 1px 10%), linear-gradient(180deg, #141516, #1f2023);
    box-shadow:inset 0 0 0 3px #050506, inset 0 4px 10px rgba(0,0,0,.8); }
  .track:focus-visible{ outline:3px solid #fff; outline-offset:2px; }
  .knob{ position:absolute; top:50%; left:0; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%; will-change:transform;
    background:radial-gradient(circle at 35% 30%, #eceef0, #a7a8ad 45%, #5f6065 85%); box-shadow:0 4px 8px rgba(0,0,0,.6); }
  .knob::after{ content:""; position:absolute; left:50%; top:6px; bottom:6px; width:3px; margin-left:-1.5px; border-radius:2px; background:#2a2b2e; }
  .lock{ width:24px; height:24px; flex:none; border-radius:50%; background:#1f3a47; box-shadow:inset 0 0 0 2px #0b1820;
    display:flex; align-items:center; justify-content:center; color:transparent; font-weight:700; font-size:14px; transition:background .15s; }
  .lock.on{ background:var(--good); color:#0c2a14; box-shadow:0 0 10px rgba(61,220,99,.6); }
  @media (max-height:430px){ #scope{ height:24vh; } .ctrl{ margin-top:6px; } .track{ height:38px; } .knob{ width:34px; height:34px; margin:-17px 0 0 -17px; } }

</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="panel" id="panel">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="caution"></div>
    <h1>SIGNAL TUNER</h1>
    <div class="screen"><canvas id="scope" aria-hidden="true"></canvas></div>
    <div class="ctrl"><span class="lbl">FREQ</span><div class="track" id="tF" tabindex="0" role="slider" aria-label="Frequency" aria-valuemin="0" aria-valuemax="100"><div class="knob" id="kF"></div></div><span class="lock" id="lF">&#10003;</span></div>
    <div class="ctrl"><span class="lbl">AMP</span><div class="track" id="tA" tabindex="0" role="slider" aria-label="Amplitude" aria-valuemin="0" aria-valuemax="100"><div class="knob" id="kA"></div></div><span class="lock" id="lA">&#10003;</span></div>
    <div class="status" id="status" role="status" aria-live="polite">Match the green wave</div>
  </div>
<script>
(function(){
  var panel = document.getElementById('panel');
  var statusEl = document.getElementById('status');
  var flashEl = document.getElementById('flash');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function vibrate(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function setStatus(text, kind){
    var cls = 'status' + (kind ? ' ' + kind : '');
    if (statusEl.textContent === text && statusEl.className === cls) return;
    statusEl.textContent = text; statusEl.className = cls;
  }
  function doFlash(kind){ flashEl.className = 'flash'; void flashEl.offsetWidth; flashEl.className = 'flash ' + kind; }
  function shakePanel(){ panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake'); }
  var finished = false;
  // Finishing: the frame glows green and the task is reported; no banner or remarks.
  function finish(){
    if (finished) return;
    finished = true;
    panel.classList.add('done');
    setStatus('✓', 'good');
    doFlash('good');
    vibrate(40);
    if (window.completeTask) window.completeTask(1500);
  }

  // ---- this game ----
  var TOL_F = 0.035, TOL_A = 0.045;   // how close each slider must be (0..1 of its travel)
  var HOLD_NEEDED = 1.0;
  var PAD = 22;
  var cv = document.getElementById('scope'), ctx = cv.getContext('2d');
  var sliders = [
    { track:document.getElementById('tF'), knob:document.getElementById('kF'), lock:document.getElementById('lF'), tol:TOL_F },
    { track:document.getElementById('tA'), knob:document.getElementById('kA'), lock:document.getElementById('lA'), tol:TOL_A }
  ];
  sliders.forEach(function(s){
    s.target = rnd(0.15, 0.85);
    s.u = s.target > 0.5 ? s.target - rnd(0.35, 0.5) : s.target + rnd(0.35, 0.5);
    s.u = clamp(s.u, 0, 1);
  });
  function freqOf(u){ return 1 + 4 * u; }      // cycles across the screen
  function ampOf(u){ return 0.15 + 0.85 * u; }

  sliders.forEach(function(s){
    var dragging = false;
    function setFrom(e){ var r = s.track.getBoundingClientRect(); s.u = clamp((e.clientX - r.left - PAD) / (r.width - 2 * PAD), 0, 1); }
    s.track.addEventListener('pointerdown', function(e){ if (finished) return; e.preventDefault(); try{ s.track.setPointerCapture(e.pointerId); }catch(err){} dragging = true; setFrom(e); });
    s.track.addEventListener('pointermove', function(e){ if (dragging && !finished) setFrom(e); });
    s.track.addEventListener('pointerup', function(){ dragging = false; });
    s.track.addEventListener('pointercancel', function(){ dragging = false; });
    s.track.addEventListener('keydown', function(e){
      if (finished) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); s.u = clamp(s.u + 0.01, 0, 1); }
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); s.u = clamp(s.u - 0.01, 0, 1); }
    });
  });

  function wave(w, h, f, a, phase, color, width, dash){
    ctx.beginPath();
    for (var x = 0; x <= w; x += 2){
      var y = h / 2 - a * h * 0.4 * Math.sin(2 * Math.PI * f * x / w + phase);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.setLineDash(dash || []); ctx.lineWidth = width; ctx.strokeStyle = color; ctx.stroke(); ctx.setLineDash([]);
  }

  var hold = 0, last = performance.now(), t = 0, wasLocked = [false, false];
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    var dpr = Math.min(2, window.devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(127,216,255,.08)'; ctx.lineWidth = 1;
    for (var gx = w / 10; gx < w; gx += w / 10){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, h); ctx.stroke(); }
    for (var gy = h / 6; gy < h; gy += h / 6){ ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(w, gy); ctx.stroke(); }

    var locked = sliders.map(function(s){ return Math.abs(s.u - s.target) <= s.tol; });
    var both = locked[0] && locked[1];
    var phase = t * 2.2;
    wave(w, h, freqOf(sliders[0].target), ampOf(sliders[1].target), phase, 'rgba(61,220,99,.55)', 3, [7, 6]);
    wave(w, h, freqOf(sliders[0].u), ampOf(sliders[1].u), phase, both ? '#a7f5b4' : '#7fd8ff', 2.5);

    sliders.forEach(function(s, i){
      var r = s.track.clientWidth;
      s.knob.style.transform = 'translateX(' + (PAD + s.u * (r - 2 * PAD)) + 'px)';
      s.track.setAttribute('aria-valuenow', Math.round(s.u * 100));
      s.lock.classList.toggle('on', locked[i] || finished);
      if (locked[i] && !wasLocked[i]) vibrate(10);
      wasLocked[i] = locked[i];
    });
    if (!finished){
      if (both){ hold += dt; setStatus('Hold'); if (hold >= HOLD_NEEDED) finish(); }
      else { hold = 0; setStatus('Match the green wave'); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(function(n){ last = n; frame(n); });

})();
</script>
</body>
</html>
