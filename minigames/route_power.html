<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="location" content="Power room">
<title>Power routing</title>
<style>
  :root{
    --panel-dark:#242527; --panel-mid:#2f3033; --panel-light:#3c3d41; --bezel:#0e0e10;
    --caution-yellow:#f2c14e; --caution-black:#1a1a1c;
    --text-label:#d3d4d9; --text-dim:#8d8e93;
    --screen:#0d1a22; --screen-text:#7fd8ff; --screen-dim:#3f6f86;
    --good:#3ddc63; --warn:#ffb35a; --bad:#ff5a4a;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    background:radial-gradient(ellipse at 50% 0%, #2a2a2e 0%, #131315 60%, #0a0a0b 100%);
    font-family:'Arial Narrow', Arial, Helvetica, sans-serif; color:var(--text-label);
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  .panel{
    position:relative; width:100%; max-width:560px;
    background:
      repeating-linear-gradient(100deg, var(--panel-mid) 0 2px, var(--panel-light) 3px, var(--panel-mid) 4px),
      linear-gradient(180deg, var(--panel-light), var(--panel-dark));
    border-radius:14px; padding:18px 20px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px var(--bezel), inset 0 0 0 8px #050506;
    transition:box-shadow .5s;
  }
  .panel.done{ box-shadow:0 20px 50px rgba(0,0,0,.6), 0 0 34px rgba(61,220,99,.35), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 6px #1b6b30, inset 0 0 0 8px #050506; }
  .panel.shake{ animation:shake .32s linear; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); } 80%{ transform:translateX(2px); }
  }
  .rivet{ position:absolute; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eceef0, #a7a8ad 45%, #5f6065 80%);
    box-shadow:0 1px 2px rgba(0,0,0,.8), inset 0 0 2px rgba(0,0,0,.6); }
  .rivet.tl{ top:14px; left:14px; } .rivet.tr{ top:14px; right:14px; }
  .rivet.bl{ bottom:14px; left:14px; } .rivet.br{ bottom:14px; right:14px; }
  .caution{ height:9px; border-radius:3px; margin:0 18px 10px;
    background:repeating-linear-gradient(-45deg, var(--caution-yellow) 0 10px, var(--caution-black) 10px 20px); }
  h1{ margin:0 0 10px; text-align:center; font-size:clamp(18px, 5vw, 24px); letter-spacing:3px; color:#eceef0; text-shadow:0 2px 0 #000; }
  .screen{
    position:relative; border-radius:8px; padding:10px 12px;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at 50% 40%, #12303d, var(--screen) 75%);
    box-shadow:inset 0 0 0 3px #050506, inset 0 0 24px rgba(0,0,0,.8);
    color:var(--screen-text);
  }
  .status{ margin-top:12px; min-height:34px; text-align:center; padding:6px 10px; border-radius:6px;
    background:#151617; box-shadow:inset 0 2px 5px rgba(0,0,0,.8);
    font-family:'Courier New', monospace; font-weight:700; letter-spacing:1px; font-size:clamp(13px, 3.8vw, 16px); color:var(--screen-text); }
  .status.warn{ color:var(--warn); }
  .status.good{ color:var(--good); }
  .flash{ position:fixed; inset:0; pointer-events:none; opacity:0; z-index:50; }
  .flash.good{ background:#3ddc63; animation:flash .5s ease-out; }
  .flash.bad{ background:#ff5a4a; animation:flashb .3s ease-out; }
  @keyframes flash{ 0%{ opacity:0; } 30%{ opacity:.5; } 100%{ opacity:0; } }
  @keyframes flashb{ 0%{ opacity:0; } 30%{ opacity:.22; } 100%{ opacity:0; } }
  @media (max-height:430px){
    .panel{ padding:10px 16px 10px; }
    h1{ font-size:17px; margin-bottom:6px; } .caution{ margin-bottom:6px; }
    .status{ margin-top:6px; min-height:28px; padding:4px 8px; }
  }
  @media (prefers-reduced-motion:reduce){
    .panel.shake{ animation:none; }
    .flash.good, .flash.bad{ animation-duration:.01s; }
  }

  /* ---- this game ---- */
  .board{ position:relative; margin:2px auto 0; width:min(100%, calc(100vh - 190px), 420px); aspect-ratio:1; }
  .grid{ position:absolute; inset:9%; display:grid; grid-template-columns:repeat(5, 1fr); gap:3px; }
  .tile{ border:0; padding:0; border-radius:6px; cursor:pointer; touch-action:manipulation; background:#17181b; box-shadow:inset 0 0 0 2px #050506; }
  .tile:focus-visible{ outline:3px solid #fff; outline-offset:1px; position:relative; z-index:2; }
  .tile svg{ width:100%; height:100%; display:block; transition:transform .16s ease-out; }
  .tile .p{ stroke:#3b3f45; stroke-width:16; stroke-linecap:round; fill:none; }
  .tile .c{ stroke:#5b6068; stroke-width:6; stroke-linecap:round; fill:none; transition:stroke .15s; }
  .tile .hub{ fill:#5b6068; transition:fill .15s; }
  .tile.lit .c{ stroke:#7fd8ff; filter:drop-shadow(0 0 3px rgba(127,216,255,.9)); }
  .tile.lit .hub{ fill:#7fd8ff; }
  .term{ position:absolute; width:7.5%; aspect-ratio:1; margin:-3.75% 0 0 -3.75%; border-radius:50%; }
  .term.src{ background:radial-gradient(circle at 35% 30%, #ffe08a, #f2c14e 55%, #8a6a1e); box-shadow:0 0 10px rgba(242,193,78,.6); }
  .term.src svg{ width:70%; height:70%; margin:15%; display:block; }
  .term.out{ background:#1f2023; box-shadow:inset 0 0 0 3px #3b3f45; transition:background .2s, box-shadow .2s; }
  .term.out::after{ content:""; position:absolute; inset:30%; border-radius:50%; background:#3b3f45; transition:background .2s; }
  .term.out.lit{ background:#14323f; box-shadow:inset 0 0 0 3px #7fd8ff, 0 0 14px rgba(127,216,255,.8); }
  .term.out.lit::after{ background:#e8f8ff; }
  @media (max-height:430px){ .board{ width:min(100%, calc(100vh - 118px)); margin-top:0; } }
  @media (prefers-reduced-motion:reduce){ .tile svg{ transition:none; } }

</style>
</head>
<body>
  <div class="flash" id="flash"></div>
  <div class="panel" id="panel">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <div class="caution"></div>
    <h1>POWER ROUTING</h1>
    <div class="board" id="board"><div class="grid" id="grid"></div></div>
    <div class="status" id="status" role="status" aria-live="polite">Tap tiles to route power</div>
  </div>
<script>
(function(){
  var panel = document.getElementById('panel');
  var statusEl = document.getElementById('status');
  var flashEl = document.getElementById('flash');
  var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function vibrate(p){ try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function rnd(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function setStatus(text, kind){
    var cls = 'status' + (kind ? ' ' + kind : '');
    if (statusEl.textContent === text && statusEl.className === cls) return;
    statusEl.textContent = text; statusEl.className = cls;
  }
  function doFlash(kind){ flashEl.className = 'flash'; void flashEl.offsetWidth; flashEl.className = 'flash ' + kind; }
  function shakePanel(){ panel.classList.remove('shake'); void panel.offsetWidth; panel.classList.add('shake'); }
  var finished = false;
  // Finishing: the frame glows green and the task is reported; no banner or remarks.
  function finish(){
    if (finished) return;
    finished = true;
    panel.classList.add('done');
    setStatus('✓', 'good');
    doFlash('good');
    vibrate(40);
    if (window.completeTask) window.completeTask(1500);
  }

  // ---- this game ----
  var N = 5, OUTPUTS = 3;
  var BIT = [1, 2, 4, 8];                  // N, E, S, W
  var DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
  function opp(d){ return (d + 2) % 4; }
  function rotl(m, k){ k %= 4; return ((m << k) | (m >> (4 - k))) & 15; }
  var board = document.getElementById('board'), grid = document.getElementById('grid');

  // --- build a solvable network: a random spanning tree, a source on the left edge, lamps on the others
  var base = new Array(N * N).fill(0);
  (function tree(){
    var seen = new Array(N * N).fill(false), stack = [Math.floor(Math.random() * N * N)];
    seen[stack[0]] = true;
    while (stack.length){
      var cur = stack[stack.length - 1], r = Math.floor(cur / N), c = cur % N, opts = [];
      for (var d = 0; d < 4; d++){ var nr = r + DR[d], nc = c + DC[d]; if (nr >= 0 && nr < N && nc >= 0 && nc < N && !seen[nr * N + nc]) opts.push(d); }
      if (!opts.length){ stack.pop(); continue; }
      var dd = opts[Math.floor(Math.random() * opts.length)], nxt = (r + DR[dd]) * N + (c + DC[dd]);
      base[cur] |= BIT[dd]; base[nxt] |= BIT[opp(dd)]; seen[nxt] = true; stack.push(nxt);
    }
  })();
  var srcRow = Math.floor(Math.random() * N), srcCell = srcRow * N;
  base[srcCell] |= BIT[3];
  var edges = [];
  for (var i = 0; i < N; i++){ edges.push({ cell:i, d:0 }); edges.push({ cell:i * N + N - 1, d:1 }); edges.push({ cell:(N - 1) * N + i, d:2 }); }
  var outs = [];
  while (outs.length < OUTPUTS){
    var cand = edges.splice(Math.floor(Math.random() * edges.length), 1)[0];
    if (cand.cell === srcCell || outs.some(function(o){ return o.cell === cand.cell; })) continue;
    outs.push(cand); base[cand.cell] |= BIT[cand.d];
  }

  var turns = base.map(function(){ return Math.floor(Math.random() * 4); });
  function maskAt(i){ return rotl(base[i], turns[i]); }
  function powered(){
    var on = new Array(N * N).fill(false);
    if (!(maskAt(srcCell) & BIT[3])) return on;
    var q = [srcCell]; on[srcCell] = true;
    while (q.length){
      var cur = q.shift(), r = Math.floor(cur / N), c = cur % N, m = maskAt(cur);
      for (var d = 0; d < 4; d++){
        if (!(m & BIT[d])) continue;
        var nr = r + DR[d], nc = c + DC[d];
        if (nr < 0 || nr >= N || nc < 0 || nc >= N) continue;
        var nx = nr * N + nc;
        if (!on[nx] && (maskAt(nx) & BIT[opp(d)])){ on[nx] = true; q.push(nx); }
      }
    }
    return on;
  }
  function litOutputs(on){ return outs.map(function(o){ return on[o.cell] && !!(maskAt(o.cell) & BIT[o.d]); }); }
  // never start already solved
  for (var tries = 0; tries < 50 && litOutputs(powered()).some(Boolean); tries++) turns = turns.map(function(){ return Math.floor(Math.random() * 4); });

  // --- draw
  var ENDS = [[50, 0], [100, 50], [50, 100], [0, 50]];
  var tiles = base.map(function(m, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tile';
    b.setAttribute('aria-label', 'Tile row ' + (Math.floor(i / N) + 1) + ', column ' + (i % N + 1) + '. Press to rotate.');
    var lines = '';
    for (var d = 0; d < 4; d++) if (m & BIT[d]) lines += 'M50 50 L' + ENDS[d][0] + ' ' + ENDS[d][1] + ' ';
    b.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="p" d="' + lines + '"/><path class="c" d="' + lines + '"/><circle class="hub" cx="50" cy="50" r="9"/></svg>';
    b._angle = turns[i] * 90;
    b.firstChild.style.transform = 'rotate(' + b._angle + 'deg)';
    b.addEventListener('click', function(){
      if (finished) return;
      turns[i] = (turns[i] + 1) % 4; b._angle += 90;
      b.firstChild.style.transform = 'rotate(' + b._angle + 'deg)';
      vibrate(5);
      update();
    });
    grid.appendChild(b);
    return b;
  });
  function place(el, cell, d){
    // centre of the cell's edge, in board %; the grid sits 9% in from each side
    var r = Math.floor(cell / N), c = cell % N, s = 82 / N;
    var x = 9 + s * c + s / 2 + DC[d] * (s / 2 + 4.5), y = 9 + s * r + s / 2 + DR[d] * (s / 2 + 4.5);
    el.style.left = x + '%'; el.style.top = y + '%';
  }
  var src = document.createElement('div'); src.className = 'term src';
  src.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 H11 L10 22 L20 9 H13 Z" fill="#3a2a05"/></svg>';
  place(src, srcCell, 3); board.appendChild(src);
  var lamps = outs.map(function(o){ var l = document.createElement('div'); l.className = 'term out'; place(l, o.cell, o.d); board.appendChild(l); return l; });

  var litBefore = 0;
  function update(){
    var on = powered(), lit = litOutputs(on), n = 0;
    tiles.forEach(function(t, i){ t.classList.toggle('lit', on[i]); });
    lamps.forEach(function(l, i){ l.classList.toggle('lit', lit[i]); if (lit[i]) n++; });
    if (n > litBefore) vibrate(20);
    litBefore = n;
    if (n === OUTPUTS) finish();
  }
  update();
  // QA hook for automated tests: ?qa=1 exposes the turns (all 0 = solved).
  if (/[?&]qa=1/.test(location.search)) window.__route = { turns:function(){ return turns.slice(); } };

})();
</script>
</body>
</html>
