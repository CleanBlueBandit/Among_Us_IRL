<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>O2 Life Support</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/serverdevice.js"></script>
    <script src="/alarmaudio.js"></script>
    <style>
        :root {
            --bg: #07090c; --panel: #0e1319; --panel-2: #131a22; --edge: #222c38; --text: #d8e3ee; --dim: #6f8296;
            --cyan: #00e5ff; --red: #ff3333; --green: #34d399; --amber: #fbbf24;
            --c: var(--cyan);
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono);
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        body.crisis { --c: var(--red); }
        body.restored { --c: var(--green); }

        #overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(255, 0, 0, 0.45) 100%);
        }
        body.crisis #overlay { animation: flash 1.2s infinite; }
        @keyframes flash { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }

        /* ---- connect ---- */
        .connect { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg); }
        .connect[hidden] { display: none; }
        .btn-connect {
            font: 700 1.1rem var(--mono); letter-spacing: 0.12em; padding: 18px 34px; cursor: pointer;
            color: var(--cyan); background: transparent; border: 2px solid var(--cyan); border-radius: 6px;
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.3);
        }
        .btn-connect:hover, .btn-connect:focus-visible { background: var(--cyan); color: #04131a; outline: none; }

        /* ---- console ---- */
        .console {
            position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column;
            padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            gap: 14px;
        }
        .bar {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            font-size: 0.78rem; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase;
            border-bottom: 1px solid var(--edge); padding-bottom: 10px;
        }
        .bar b { color: var(--text); font-weight: 700; }
        .lamp { display: inline-flex; align-items: center; gap: 8px; color: var(--c); }
        .lamp i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
        body.crisis .lamp i { animation: blink 0.6s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0.15; } }

        .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 18px; align-content: center; }
        body.crisis .main { grid-template-columns: minmax(0, 1.05fr) minmax(280px, 0.95fr); align-items: center; }

        .status { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; min-width: 0; }
        #state {
            font-size: clamp(1.7rem, 5.4vw, 3.4rem); font-weight: 800; letter-spacing: 0.06em; line-height: 1.05;
            color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 55%, transparent);
        }
        body.crisis #state { animation: pulse 1s infinite alternate; }
        @keyframes pulse { to { transform: scale(1.03); } }
        #clock { font-size: clamp(3rem, 12vw, 6.5rem); font-weight: 800; color: var(--red); line-height: 1; font-variant-numeric: tabular-nums; }
        #clock[hidden] { display: none; }

        .gauge { width: min(420px, 100%); }
        .gauge-label { display: flex; justify-content: space-between; font-size: 0.75rem; letter-spacing: 0.18em; color: var(--dim); margin-bottom: 6px; }
        .gauge-label b { color: var(--c); font-variant-numeric: tabular-nums; }
        .gauge-track { height: 16px; border: 1px solid var(--edge); background: #05080b; border-radius: 3px; padding: 2px; overflow: hidden; }
        .gauge-fill {
            height: 100%; width: 100%; border-radius: 2px; transition: width 1s linear, background-color 0.4s;
            background: repeating-linear-gradient(90deg, var(--c) 0 10px, color-mix(in srgb, var(--c) 70%, #000) 10px 12px);
            box-shadow: 0 0 10px color-mix(in srgb, var(--c) 50%, transparent);
        }

        .codes { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .codes[hidden] { display: none; }
        .codes-label { font-size: 0.75rem; letter-spacing: 0.2em; color: var(--dim); }
        .lights { display: flex; gap: 10px; }
        .light {
            width: 46px; height: 14px; border-radius: 3px; border: 1px solid #3a2020; background: #1a0d0d;
            transition: background 0.3s, box-shadow 0.3s, border-color 0.3s;
        }
        .light.on { background: var(--green); border-color: var(--green); box-shadow: 0 0 12px var(--green); }
        .hint { margin: 0; max-width: 40ch; font-size: 0.8rem; line-height: 1.45; color: var(--dim); }
        .hint[hidden] { display: none; }

        /* ---- keypad ---- */
        .keypad {
            position: relative; justify-self: center; width: min(360px, 100%); cursor: text;
            background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--edge); border-radius: 14px;
            padding: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 10px 30px rgba(0,0,0,0.5);
        }
        .keypad[hidden] { display: none; }
        .kp-title { font-size: 0.7rem; letter-spacing: 0.24em; color: var(--dim); text-align: center; margin-bottom: 10px; }
        .kp-foot { font-size: 0.66rem; letter-spacing: 0.2em; color: var(--dim); text-align: center; margin-top: 10px; }
        .kp-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
        .screen {
            background: #031215; border: 1px solid #0c3a40; border-radius: 6px; padding: 10px 12px 8px;
            box-shadow: inset 0 0 18px rgba(0, 229, 255, 0.12);
        }
        .digits { display: flex; justify-content: center; gap: 8px; }
        .digit {
            width: 2.1ch; font-size: 2.2rem; font-weight: 800; text-align: center; color: var(--cyan); line-height: 1.1;
            border-bottom: 2px solid #0f5a63; text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); font-variant-numeric: tabular-nums;
        }
        .digit.cursor { border-bottom-color: var(--cyan); animation: blink 1s steps(2) infinite; }
        .screen-msg { margin-top: 8px; min-height: 1.2em; text-align: center; font-size: 0.78rem; letter-spacing: 0.16em; color: #4fb8c4; }
        .screen.ok { border-color: var(--green); box-shadow: inset 0 0 22px rgba(52, 211, 153, 0.35); }
        .screen.ok .digit, .screen.ok .screen-msg { color: var(--green); text-shadow: 0 0 10px rgba(52, 211, 153, 0.7); }
        .screen.bad { border-color: var(--red); box-shadow: inset 0 0 22px rgba(255, 51, 51, 0.35); animation: shake 0.35s; }
        .screen.bad .digit, .screen.bad .screen-msg { color: var(--red); text-shadow: 0 0 10px rgba(255, 51, 51, 0.6); }
        .screen.warn .screen-msg { color: var(--amber); }
        @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }


        @media (max-width: 720px) and (min-height: 501px) {
            body.crisis .main { grid-template-columns: 1fr; align-content: start; overflow-y: auto; }
            body.crisis .status { gap: 8px; }
            body.crisis #state { font-size: 1.6rem; }
            body.crisis #clock { font-size: 3rem; }
        }
        /* short landscape screens (a phone on its side): keep two columns, shrink everything */
        @media (max-height: 500px) {
            .console { gap: 8px; }
            .bar { padding-bottom: 6px; }
            body.crisis .main { grid-template-columns: minmax(0, 1fr) minmax(240px, 300px); gap: 12px; }
            body.crisis .status { gap: 6px; }
            body.crisis #state { font-size: 1.4rem; }
            body.crisis #clock { font-size: 2.6rem; }
            .hint { display: none !important; }
            .keypad { padding: 10px; }
            .screen { padding: 6px 10px 4px; }
            .digit { font-size: 1.6rem; }
            .screen-msg { margin-top: 4px; }
        }
    </style>
</head>
<body>
    <div id="overlay"></div>

    <div class="connect" id="connect">
        <button id="start-btn" class="btn-connect" type="button">CONNECT TO O2 FEED</button>
    </div>

    <div class="console">
        <div class="bar">
            <span><b>O2</b> // LIFE SUPPORT</span>
            <span class="lamp" id="lamp"><i></i><span id="lampText">NOMINAL</span></span>
        </div>
        <div class="main">
            <section class="status" aria-live="polite">
                <div id="state">O2 RESERVES OPTIMAL</div>
                <div id="clock" hidden>1:30</div>
                <div class="gauge">
                    <div class="gauge-label"><span>O2 RESERVE</span><b id="pct">100%</b></div>
                    <div class="gauge-track"><div class="gauge-fill" id="fill"></div></div>
                </div>
                <div class="codes" id="codes" hidden>
                    <span class="codes-label" id="codesLabel">OVERRIDE CODES 0 / 2</span>
                    <div class="lights" id="lights"></div>
                </div>
                <p class="hint" id="hint" hidden>Every crewmate's tablet shows an override code. Enter codes from two different crewmates to restore O2.</p>
            </section>

            <section class="keypad" id="keypad" hidden aria-label="Override code entry">
                <div class="kp-title">ENTER OVERRIDE CODE</div>
                <div class="screen" id="screen">
                    <div class="digits" id="digits" aria-hidden="true"></div>
                    <div class="screen-msg" id="screenMsg" role="status">AWAITING INPUT</div>
                </div>
                <div class="kp-foot">TYPE THE CODE · ENTER TO SUBMIT</div>
                <input class="kp-input" id="kpInput" inputmode="numeric" autocomplete="off" aria-label="Override code" tabindex="-1">
            </section>

        </div>
    </div>


    <script>
        const $ = id => document.getElementById(id);
        const CODE_LEN = 5;
        let socket = null, audio = null, alarm = null;   // alarm: the looping alarm and its voice (alarmaudio.js)
        let state = 'stable';          // stable | crisis | restored | game-over
        let endTime = 0, total = 0, need = 2, accepted = 0, lockUntil = 0;
        let entry = '', busy = false, msgTimer = null, tickTimer = null, restoredTimer = null;

        // ---- sound: short synth blips, allowed by the connect tap ----
        function tone(freq, ms, type, gain) {
            if (!audio) return;
            const o = audio.createOscillator(), g = audio.createGain();
            o.type = type || 'square'; o.frequency.value = freq;
            g.gain.setValueAtTime(gain || 0.06, audio.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + ms / 1000);
            o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + ms / 1000);
        }
        const sfx = {
            key: () => tone(1250, 60, 'square', 0.04),
            ok: () => { tone(880, 110, 'sine', 0.12); setTimeout(() => tone(1320, 170, 'sine', 0.12), 110); },
            bad: () => tone(150, 380, 'sawtooth', 0.09),
            done: () => [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => tone(f, 160, 'sine', 0.12), i * 120))
        };

        // ---- display ----
        function renderDigits() {
            const box = $('digits'); box.innerHTML = '';
            for (let i = 0; i < CODE_LEN; i++) {
                const d = document.createElement('span');
                d.className = 'digit' + (i === entry.length ? ' cursor' : '');
                d.textContent = entry[i] || ' ';
                box.appendChild(d);
            }
        }
        function screenMsg(text, cls, holdMs) {
            clearTimeout(msgTimer);
            $('screen').className = 'screen' + (cls ? ' ' + cls : '');
            $('screenMsg').textContent = text;
            if (holdMs) msgTimer = setTimeout(() => { entry = ''; renderDigits(); idleMsg(); }, holdMs);
        }
        function idleMsg() {
            if (Date.now() < lockUntil) return;
            screenMsg(entry.length ? 'ENTER ' + (CODE_LEN - entry.length) + ' MORE' : 'AWAITING INPUT');
        }
        function renderCodes() {
            $('codesLabel').textContent = 'OVERRIDE CODES ' + Math.min(accepted, need) + ' / ' + need;
            const box = $('lights'); box.innerHTML = '';
            for (let i = 0; i < need; i++) {
                const l = document.createElement('span');
                l.className = 'light' + (i < accepted ? ' on' : '');
                box.appendChild(l);
            }
        }
        function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
        function tick() {
            const now = Date.now();
            if (state === 'crisis') {
                const left = Math.max(0, (endTime - now) / 1000);
                $('clock').textContent = fmt(left);
                const p = total > 0 ? Math.max(0, Math.min(1, left / total)) : 0;
                $('pct').textContent = Math.round(p * 100) + '%';
                $('fill').style.width = (p * 100) + '%';
            }
            const locked = now < lockUntil;
            if (locked) screenMsg('KEYPAD LOCKED ' + Math.ceil((lockUntil - now) / 1000) + 'S', 'bad warn');
            else if ($('screen').classList.contains('warn')) { entry = ''; renderDigits(); screenMsg('AWAITING INPUT'); }
        }

        function setState(next) {
            if (state === next) return;
            state = next;
            document.body.classList.toggle('crisis', next === 'crisis');
            document.body.classList.toggle('restored', next === 'restored');
            const crisis = next === 'crisis';
            $('clock').hidden = !crisis;
            $('keypad').hidden = !crisis;
            $('codes').hidden = !crisis;
            $('hint').hidden = !crisis;
            if (crisis) {
                $('state').textContent = 'O2 DEPLETING';
                $('lampText').textContent = 'ALARM';
                entry = ''; renderDigits(); idleMsg(); renderCodes();
                if (socket) socket.emit('unstable', { activated: true });
                if (alarm) alarm.start();
            } else {
                if (alarm) alarm.stop();
                $('pct').textContent = '100%'; $('fill').style.width = '100%';
                if (next === 'restored') { $('state').textContent = 'O2 RESTORED'; $('lampText').textContent = 'RESTORED'; }
                else if (next === 'stable') { $('state').textContent = 'O2 RESERVES OPTIMAL'; $('lampText').textContent = 'NOMINAL'; }
                else { $('lampText').textContent = 'OFFLINE'; }
            }
        }
        function restored() {
            if (state !== 'crisis') return;
            sfx.done();
            setState('restored');
            clearTimeout(restoredTimer);
            restoredTimer = setTimeout(() => { if (state === 'restored') setState('stable'); }, 4000);
        }

        // ---- keypad input ----
        function press(k) {
            if (state !== 'crisis' || busy || Date.now() < lockUntil) return;
            if ($('screen').classList.contains('ok') || $('screen').classList.contains('bad')) { entry = ''; screenMsg(''); }
            if (k === 'clr') { sfx.key(); entry = ''; renderDigits(); idleMsg(); return; }
            if (k === 'del') { if (entry) { sfx.key(); entry = entry.slice(0, -1); renderDigits(); idleMsg(); } return; }
            if (k === 'ok') {
                if (entry.length < CODE_LEN) { sfx.bad(); screenMsg('CODE TOO SHORT', 'bad', 1400); return; }
                busy = true; tick();
                screenMsg('VERIFYING…');
                socket.emit('o2_code', { code: entry });
                return;
            }
            if (entry.length >= CODE_LEN) return;
            sfx.key();
            entry += k; renderDigits(); idleMsg();
        }
        // No on-screen keys: the code comes from a keyboard / number pad plugged into this device.
        // On a touch screen, tapping the code panel brings up the system number pad.
        $('keypad').addEventListener('click', () => { $('kpInput').value = ''; $('kpInput').focus(); });
        $('kpInput').addEventListener('input', e => { e.target.value = ''; });
        document.addEventListener('keydown', e => {
            let k = null;
            if (/^[0-9]$/.test(e.key)) k = e.key;
            else if (e.key === 'Enter') k = 'ok';
            else if (e.key === 'Backspace') k = 'del';
            else if (e.key === 'Escape' || e.key === 'Delete') k = 'clr';
            if (!k || state !== 'crisis') return;
            e.preventDefault();
            press(k);
        });

        function onAck(r) {
            busy = false;
            if (!r) return;
            if (r.result === 'accepted') {
                sfx.ok();
                accepted = r.accepted; need = r.need || need; renderCodes();
                screenMsg(r.done ? 'OVERRIDE COMPLETE' : 'CODE ACCEPTED', 'ok', 1600);
            } else if (r.result === 'used') {
                sfx.bad(); screenMsg('CODE ALREADY USED', 'bad', 1600);
            } else if (r.result === 'locked') {
                sfx.bad(); lockUntil = r.lockUntil || lockUntil; screenMsg('INVALID CODE', 'bad');
            } else if (r.result === 'invalid') {
                sfx.bad(); screenMsg('INVALID CODE', 'bad', 1600);
            } else if (r.result === 'meeting') {
                screenMsg('MEETING IN PROGRESS', 'bad', 1600);
            } else if (r.result !== 'busy') {
                screenMsg('NO OVERRIDE ACTIVE', 'bad', 1600);
            }
            tick();
        }

        // ---- server ----
        function setupSocketListeners() {
            socket.on('sabotage_data_request', ({ sData, endTime: end }) => {
                const o2 = sData && sData.o2;
                if (!o2 || state === 'game-over') return;
                if (o2.sabotaged && o2.depleted) {
                    endTime = end || endTime;
                    if (!total) total = Math.max(1, Math.round((endTime - Date.now()) / 1000));
                    setState('crisis');
                } else if (state === 'crisis') {
                    restored();
                }
            });
            socket.on('o2_override_status', st => {
                if (!st || !st.active) return;
                need = st.need || need; accepted = st.accepted || 0;
                if (st.total) total = st.total;
                if (st.lockUntil > lockUntil) lockUntil = st.lockUntil;
                renderCodes(); tick();
            });
            socket.on('o2_code_ack', onAck);
            socket.on('sabotage_fixed', d => { if (d && d.type === 'o2') restored(); });
            socket.on('o2_depleted', stopForGameOver);
            socket.on('game_over', stopForGameOver);
            socket.on('Err', err => console.error('Server error:', err.error));
        }

        function resetToOptimal() {
            clearTimeout(restoredTimer);
            total = 0; accepted = 0; lockUntil = 0; entry = ''; busy = false;
            state = '';
            setState('stable');
        }
        // The game ended for any reason: stop everything; serverdevice.js shows the result.
        function stopForGameOver() {
            if (state === 'game-over') return;
            setState('game-over');
        }

        $('start-btn').addEventListener('click', () => {
            $('connect').hidden = true;
            try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
            socket = io();
            if (audio) alarm = AlarmAudio.create(audio, socket);
            setupSocketListeners();
            // game over / restart happen on this page, so sound stays allowed to play
            ServerDevice.attach(socket, { role: 'o2', onGameOver: stopForGameOver, onReset: resetToOptimal });
            tickTimer = setInterval(tick, 250);
        });
        renderDigits();
    </script>
</body>
</html>
