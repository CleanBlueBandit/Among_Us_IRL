<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Meeting Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at center, #6a6d72 0%, #4a4d52 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      padding: 16px;
    }

    /* Same tablet shell as the other device/voting screens, for visual consistency */
    .tablet {
      position: relative;
      background: #b0b3b8;
      border-radius: 24px;
      padding: 10px;
      box-shadow:
        0 0 0 3px #7a7d82,
        0 12px 48px rgba(0,0,0,0.65),
        inset 0 2px 0 rgba(255,255,255,0.22);
      width: min(520px, 96vw);
    }

    .screen {
      border-radius: 14px;
      overflow: hidden;
      background-color: #1a1e24;
      background-image: radial-gradient(ellipse at center, #262b33 0%, #14171b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 48px 24px;
      min-height: 420px;
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(18px, 3vw, 26px);
      color: #e8ecf2;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .button-ring {
      width: clamp(180px, 40vw, 240px);
      height: clamp(180px, 40vw, 240px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a4f58, #202329);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .call-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #7a1010;
      background: radial-gradient(circle at 38% 30%, #ff5a4a, #c81c1c);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(16px, 2.6vw, 22px);
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7a1010, 0 10px 18px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.25);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .call-btn:hover:not(:disabled) { transform: translateY(1px); }
    .call-btn:active:not(:disabled) {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #7a1010, 0 3px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.25);
    }
    .call-btn:disabled {
      cursor: default;
      background: radial-gradient(circle at 38% 30%, #8a8f96, #5a5e64);
      border-color: #3a3d42;
      box-shadow: 0 6px 0 #3a3d42, inset 0 2px 4px rgba(255,255,255,0.1);
      color: #cfd3d8;
    }

    .status {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(13px, 2vw, 16px);
      color: #b8c0cc;
      text-align: center;
      min-height: 20px;
    }
    .status.urgent { color: #ff6a5a; }

    @media (max-width: 480px) {
      .screen { padding: 36px 16px; min-height: 360px; gap: 22px; }
    }
  </style>
</head>
<body>

<div class="tablet">
  <div class="screen">
    <div class="title">Emergency Meeting</div>

    <div class="button-ring">
      <button class="call-btn" id="callBtn">CALL<br>MEETING</button>
    </div>

    <div class="status" id="status">Ready.</div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const btn = document.getElementById('callBtn');
  const statusEl = document.getElementById('status');

  let meetingActive = false;

  function setStatus(text, urgent = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle('urgent', urgent);
  }

  function updateButton() {
    btn.disabled = meetingActive;
    btn.innerHTML = meetingActive ? 'MEETING<br>IN PROGRESS' : 'CALL<br>MEETING';
  }

  // This device only ever calls a meeting - it never casts or sees votes.
  btn.addEventListener('click', () => {
    if (meetingActive) return;
    socket.emit('emergency');
  });

  socket.on('emergency_ack', (payload) => {
    meetingActive = true;
    updateButton();
    setStatus(`Meeting called - ${payload.countdown}s to discuss.`);
  });

  socket.on('emergency_result', (payload) => {
    meetingActive = false;
    updateButton();
    const ejectedName = payload.ejected && payload.players[payload.ejected]
      ? payload.players[payload.ejected].username
      : null;
    setStatus(ejectedName ? `${ejectedName} was ejected.` : 'No one was ejected.');
  });

  socket.on('Err', (payload) => {
    setStatus(payload && payload.error ? payload.error : 'Something went wrong.', true);
  });

  socket.on("game_over", (data) => {
    window.location.href = "/win";
  });
</script>
</body>
</html>
