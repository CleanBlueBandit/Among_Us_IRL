<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Meeting & Reveal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(ellipse at center, #6a6d72 0%, #4a4d52 100%);
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      padding: 16px;
      overflow: hidden; /* Prevent scrolling during fullscreen reveal */
    }

    /* -------------------- Tablet UI -------------------- */
    .tablet {
      position: relative;
      background: #b0b3b8;
      border-radius: 24px;
      padding: 10px;
      box-shadow:
        0 0 0 3px #7a7d82,
        0 12px 48px rgba(0,0,0,0.65),
        inset 0 2px 0 rgba(255,255,255,0.22);
      width: min(520px, 96vw);
      z-index: 10;
    }

    .screen {
      border-radius: 14px;
      overflow: hidden;
      background-color: #1a1e24;
      background-image: radial-gradient(ellipse at center, #262b33 0%, #14171b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 48px 24px;
      min-height: 420px;
    }

    .title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(18px, 3vw, 26px);
      color: #e8ecf2;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .button-ring {
      width: clamp(180px, 40vw, 240px);
      height: clamp(180px, 40vw, 240px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #4a4f58, #202329);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 2px 6px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .call-btn {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #7a1010;
      background: radial-gradient(circle at 38% 30%, #ff5a4a, #c81c1c);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(16px, 2.6vw, 22px);
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 0 #7a1010, 0 10px 18px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.25);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .call-btn:hover:not(:disabled) { transform: translateY(1px); }
    .call-btn:active:not(:disabled) {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #7a1010, 0 3px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.25);
    }
    .call-btn:disabled {
      cursor: default;
      background: radial-gradient(circle at 38% 30%, #8a8f96, #5a5e64);
      border-color: #3a3d42;
      box-shadow: 0 6px 0 #3a3d42, inset 0 2px 4px rgba(255,255,255,0.1);
      color: #cfd3d8;
    }

    .status {
      font-weight: 800;
      font-size: clamp(13px, 2vw, 16px);
      color: #b8c0cc;
      text-align: center;
      min-height: 20px;
    }
    .status.urgent { color: #ff6a5a; }

    @media (max-width: 480px) {
      .screen { padding: 36px 16px; min-height: 360px; gap: 22px; }
    }

    /* -------------------- Cinematic Reveal Overlay -------------------- */
    .reveal-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reveal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .particles { 
      position: absolute; 
      inset: 0; 
      overflow: hidden; 
      pointer-events: none; 
      z-index: 1; 
    }
    .particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: drift linear infinite;
      opacity: 0;
    }
    @keyframes drift {
      0% { opacity: 0; transform: translateY(0); }
      10% { opacity: 0.7; }
      90% { opacity: 0.35; }
      100% { opacity: 0; transform: translateY(-40px); }
    }

    .vignette {
      position: absolute; 
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
      pointer-events: none;
      z-index: 3;
    }

    .cinematic-scene {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 90vw;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: clamp(1.6rem, 5vw, 3rem);
      color: rgba(255, 255, 255, 0.85);
      font-weight: 300;
      letter-spacing: 0.05em;
      white-space: pre-wrap;
    }

    /* Pop-in subtext for remaining impostors */
    .impostor-count {
      display: block;
      margin-top: 0;
      font-size: clamp(1.2rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
    }
    .impostor-count.pop-in {
      animation: popIn 0.35s cubic-bezier(.2,1.6,.35,1) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(1.7); filter: blur(6px); }
      55% { opacity: 1; transform: scale(0.92); filter: blur(0px); }
      100% { opacity: 1; transform: scale(1); filter: blur(0px); }
    }
  </style>
</head>
<body>

<div class="tablet">
  <div class="screen">
    <div class="title">Emergency Meeting</div>

    <div class="button-ring">
      <button class="call-btn" id="callBtn">CALL<br>MEETING</button>
    </div>

    <div class="status" id="status">Ready</div>
  </div>
</div>

<div class="reveal-overlay" id="revealOverlay">
  <div class="particles" id="particles"></div>
  <div class="cinematic-scene">
    <div id="text-container"></div>
    <div id="subtext-container" class="impostor-count"></div>
  </div>
  <div class="vignette"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  // Elements
  const btn = document.getElementById('callBtn');
  const statusEl = document.getElementById('status');
  const revealOverlay = document.getElementById('revealOverlay');
  const textContainer = document.getElementById('text-container');
  const subtextContainer = document.getElementById('subtext-container');
  const particleContainer = document.getElementById('particles');

  let meetingActive = false;
  let countdownTick = null;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  // ---------------- UI Helpers ----------------
  function setStatus(text, urgent = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle('urgent', urgent);
  }

  function updateButton(active, text) {
    btn.disabled = active;
    btn.innerHTML = text;
  }

  // ---------------- Cinematic Logic ----------------
  function initStars() {
    const starCount = 90;
    for (let i = 0; i < starCount; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = Math.random() * 2 + 1;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = Math.random() * 100 + 'vh';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      particleContainer.appendChild(p);
    }
  }

  function typeText(el, text, speed) {
    return new Promise((resolve) => {
      el.textContent = '';
      let i = 0;

      function step() {
        if (i < text.length) {
          el.textContent = text.slice(0, i + 1);
          i++;
          setTimeout(step, speed);
        } else {
          setTimeout(resolve, 300);
        }
      }
      step();
    });
  }

  async function playRevealCinematic(outcomeText, impostorCountText) {
    // 1. Prepare overlay
    revealOverlay.classList.add('active');
    textContainer.textContent = ''; 
    subtextContainer.textContent = '';
    subtextContainer.classList.remove('pop-in');
    await sleep(1500); 

    // 2. Type out the outcome text
    await typeText(textContainer, outcomeText, 100);

    // 3. Pop in remaining impostors subtext
    if (impostorCountText) {
      await sleep(600);
      subtextContainer.textContent = impostorCountText;
      subtextContainer.classList.add('pop-in');
    }

    // 4. Hold screen for 4 seconds
    await sleep(4000);

    // 5. Fade out overlay
    revealOverlay.classList.remove('active');
    await sleep(1000); 
  }

  // ---------------- Socket Events ----------------
  btn.addEventListener('click', () => {
    if (meetingActive) return;
    socket.emit('emergency');
  });



  socket.on("sabotage_data_request", (payload) => {
    if(!payload.sData.o2.depleted && !payload.sData.reactor.meltdown){
      meetingActive = false;
      updateButton(false, "CALL<br>MEETING");
      setStatus("Ready");
    }
    else{
      meetingActive = true;
      updateButton(true, "ALERT<br>CRISIS");
      setStatus("Ship component state: critical", true);
    }
  });
  socket.on('emergency_ack', (payload) => {
    meetingActive = true;
    updateButton(true, "MEETING<br>IN PROGRESS");
    setStatus(`Meeting called - ${payload.countdown}s to discuss.`);
    
    let remaining = parseInt(payload.countdown);
    const tick = () => {
      if (remaining <= 0) {
        setStatus('Voting Ended', false);
        clearInterval(countdownTick);
        return;
      }
      setStatus(`Voting Ends In: ${remaining}s`, remaining <= 10);
      remaining--;
    };
    tick();
    if (countdownTick) clearInterval(countdownTick);
    countdownTick = setInterval(tick, 1000);
  });

  socket.on("unstable", (data) => {
    
  });

  socket.on('emergency_result', async (payload) => {
    meetingActive = true;
    updateButton(true, "CALL<br>MEETING");

    if (countdownTick) clearInterval(countdownTick);

    // Ejection Text
    const ejectedPlayer = payload.ejected && payload.players ? payload.players[payload.ejected] : null;
    const ejectedName = ejectedPlayer ? ejectedPlayer.username : 'Someone';

    let tx = '';
    if (payload.result === "ejection") {
      const isImpostor = ejectedPlayer && ejectedPlayer.impostor;
      tx = `${ejectedName} ${isImpostor ? "was" : "was not"} An Impostor.`;
    } else {
      tx = `No one was ejected (${payload.result === "skip" ? "Skipped" : "Tie"}).`;
    }

    // Count Remaining Impostors
    let count = payload.impostorsRemaining;
    if (count === undefined && payload.players) {
      count = Object.values(payload.players).filter(p => p.impostor && p.isAlive !== false).length;
    }
    
    const countText = count !== undefined 
      ? `${count} ${count === 1 ? 'impostor remains' : 'impostors remain'}`
      : '';

    // Run cinematic reveal with pop-in subtext
    await playRevealCinematic(tx, countText);

    // Reset UI
    meetingActive = false;
    updateButton(false, "CALL<br>MEETING");
    setStatus('Ready');
  });

  socket.on("game_over", (data) => {
    window.location.href = "/win";
  });

  // Run initialization
  initStars();
</script>
</body>
</html>
