<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting</title>
    <style>
        :root{
            --bg-void: #04050a;
            --metal-1: #4b5058;
            --metal-2: #383c43;
            --metal-3: #24272c;
            --metal-highlight: rgba(255, 255, 255, 0.16);
            --metal-shadow: rgba(0, 0, 0, 0.55);
            --border-dim: rgba(255, 255, 255, 0.08);
            --text-bright: #f1f3f6;
            --text-dim: #9aa0a8;
            --signal: #ff3b3b;
            --signal-soft: rgba(255, 59, 59, 0.4);
            --stable: #7be08a;
            --unstable: #ff3b3b;
        }

        *{
            box-sizing: border-box;
        }

        html, body{
            height: 100%;
            margin: 0;
        }

        body{
            background: var(--bg-void);
            color: var(--text-bright);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        canvas#stars{
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
        }

        .void-gradient{
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse 60% 45% at 50% 12%, rgba(80, 100, 180, 0.10), transparent 60%),
                radial-gradient(ellipse 70% 50% at 85% 90%, rgba(120, 70, 160, 0.08), transparent 65%);
        }

        .stage{
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .panel{
            position: relative;
            width: min(440px, 100%);
            padding: 48px 36px 36px;
            border-radius: 14px;
            background:
                repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px),
                linear-gradient(160deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
            border: 1px solid rgba(0,0,0,0.6);
            box-shadow:
                inset 0 1px 0 var(--metal-highlight),
                inset 0 -2px 6px var(--metal-shadow),
                inset 0 0 0 1px rgba(255,255,255,0.04),
                0 30px 80px -30px rgba(0,0,0,0.8);
            text-align: center;
            animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .rivet{
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #d8dce0, #7d828a 55%, #303338 100%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.7), inset 0 0 1px rgba(255,255,255,0.4);
        }

        .rivet.tl{ top: 12px; left: 12px; }
        .rivet.tr{ top: 12px; right: 12px; }
        .rivet.bl{ bottom: 12px; left: 12px; }
        .rivet.br{ bottom: 12px; right: 12px; }

        @keyframes rise{
            from{ opacity: 0; transform: translateY(18px); }
            to{ opacity: 1; transform: translateY(0); }
        }

        .beacon{
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .beacon-housing{
            position: absolute;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #5a5f66, #2b2e33 70%);
            box-shadow:
                inset 0 2px 3px rgba(255,255,255,0.15),
                inset 0 -3px 4px rgba(0,0,0,0.6),
                0 2px 4px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .beacon-core{
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--signal);
            box-shadow: 0 0 12px 2px var(--signal-soft);
            z-index: 2;
            animation: core-pulse 2.2s ease-in-out infinite;
        }

        .beacon-ring{
            position: absolute;
            border-radius: 50%;
            border: 1px solid var(--signal);
            opacity: 0;
            animation: ring-out 2.6s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        }

        .beacon-ring:nth-child(2){ animation-delay: 0s; }
        .beacon-ring:nth-child(3){ animation-delay: 0.9s; }
        .beacon-ring:nth-child(4){ animation-delay: 1.8s; }

        @keyframes ring-out{
            0%   { width: 12px; height: 12px; opacity: 0.55; }
            80%  { opacity: 0; }
            100% { width: 90px; height: 90px; opacity: 0; }
        }

        @keyframes core-pulse{
            0%, 100%{ transform: scale(1); }
            50%{ transform: scale(1.25); }
        }

        h1{
            margin: 0 0 6px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .subtitle{
            margin: 0 0 32px;
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .dots::after{
            content: '';
            animation: dots 1.6s steps(4, end) infinite;
        }

        @keyframes dots{
            0%{ content: ''; }
            25%{ content: '.'; }
            50%{ content: '..'; }
            75%{ content: '...'; }
            100%{ content: ''; }
        }

        .readout{
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 18px 20px;
            margin-bottom: 28px;
            background: linear-gradient(160deg, rgba(0,0,0,0.35), rgba(0,0,0,0.15));
            border: 1px solid rgba(0,0,0,0.6);
            border-radius: 10px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: left;
        }

        .readout p{
            margin: 0;
            font-size: 13.5px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .readout p span.value{
            color: var(--text-bright);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .readout p:empty{
            display: none;
        }

        .stable{
            color: var(--stable) !important;
        }
        .unstable{
            color: var(--unstable) !important;
        }

        a.leave{
            display: inline-block;
            text-decoration: none;
        }

        button{
            font-family: inherit;
            font-size: 13px;
            letter-spacing: 0.03em;
            font-weight: 600;
            color: var(--text-dim);
            background: linear-gradient(180deg, #565b63 0%, #33363b 100%);
            border: 1px solid rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 10px 22px;
            cursor: pointer;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.18),
                inset 0 -2px 3px rgba(0,0,0,0.4),
                0 2px 4px rgba(0,0,0,0.4);
            transition: color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover{
            color: var(--text-bright);
            border-color: rgba(255, 59, 59, 0.55);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.2),
                inset 0 -2px 3px rgba(0,0,0,0.4),
                0 0 10px rgba(255, 59, 59, 0.35);
        }

        button:active{
            box-shadow:
                inset 0 2px 4px rgba(0,0,0,0.5),
                inset 0 -1px 0 rgba(255,255,255,0.05);
        }

        @media (prefers-reduced-motion: reduce){
            .panel, .beacon-ring, .beacon-core, .dots::after{
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <div class="void-gradient"></div>

    <div class="stage">
        <div class="panel">
            <div class="rivet tl"></div>
            <div class="rivet tr"></div>
            <div class="rivet bl"></div>
            <div class="rivet br"></div>

            <div class="beacon">
                <div class="beacon-ring"></div>
                <div class="beacon-ring"></div>
                <div class="beacon-ring"></div>
                <div class="beacon-housing"></div>
                <div class="beacon-core"></div>
            </div>

            <h1>Waiting for the game to start<span class="dots"></span></h1>
            <p class="subtitle">Signal locked, standing by</p>

            <div class="readout">
                <p id="usr"></p>
                <p id="id"></p>
                <p id="host"></p>
                <p id="players"></p>
            </div>

            <a class="leave" href="/logout"><button>Leave</button></a>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="common.js"></script>
    <script>
        let clientAnimationId = null;

        socket.on("player_data_request", (data) => {
            document.getElementById("usr").innerText = "username: " + data.username;
            document.getElementById("id").innerText = "id: " + data.id;
        });

        socket.on("game_data_request", (data) => {
            document.getElementById("host").innerText = "Host: " + data.host;
            document.getElementById("players").innerText = "players: " + data.playerCount;
            if(data.gameState.started){
                window.location.href ="/reveal";
            }
        })

        socket.on("start", (data) => {
            window.location.href = "/reveal"
        })

        socket.on("Err", (data) => {
            console.error("Server error\n" + data.error);
        });

        // --- ambient starfield ---
        (function(){
            const canvas = document.getElementById('stars');
            const ctx = canvas.getContext('2d');
            let w, h, stars;

            function resize(){
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                const count = Math.floor((w * h) / 2600);
                stars = Array.from({ length: count }, () => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.3 + 0.3,
                    baseAlpha: Math.random() * 0.5 + 0.3,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.015 + 0.005,
                    drift: Math.random() * 0.02 + 0.005
                }));
            }

            function draw(t){
                ctx.clearRect(0, 0, w, h);
                for(const s of stars){
                    const twinkle = Math.sin(t * s.speed + s.phase) * 0.5 + 0.5;
                    const alpha = s.baseAlpha * (0.5 + 0.5 * twinkle);
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(230, 238, 255, ${alpha.toFixed(3)})`;
                    ctx.fill();

                    s.y += s.drift * 0.15;
                    if(s.y > h) s.y = 0;
                }
                requestAnimationFrame(draw);
            }

            window.addEventListener('resize', resize);
            resize();
            requestAnimationFrame(draw);
        })();
    </script>
</body>
</html>
