<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Minigame test bench</title>
<style>
  /* Layout: list of minigames on the left, the selected one playing in a device-sized frame on the right. */
  :root{
    --bg:#0a0c10; --panel:#14171d; --panel-2:#1b1f27; --line:#272c36; --line-2:#353b47;
    --text:#e9ecf1; --dim:#9aa2ae; --faint:#677080;
    --accent:#ffb02e; --accent-soft:rgba(255,176,46,.16);
    --good:#3ddc84; --good-soft:rgba(61,220,132,.14); --bad:#ff5a4a; --bad-soft:rgba(255,90,74,.14);
    --ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html, body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font:13px/1.4 var(--ui); display:grid; grid-template-rows:auto 1fr; grid-template-columns:320px 1fr; grid-template-areas:"top top" "list stage"; overflow:hidden; }
  button, textarea{ font:inherit; color:inherit; }
  button{ cursor:pointer; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .top{ grid-area:top; display:flex; align-items:center; gap:12px; padding:9px 14px; background:var(--panel); border-bottom:1px solid var(--line); min-width:0; }
  .brand{ font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:12px; color:var(--dim); white-space:nowrap; }
  .progress{ display:flex; align-items:center; gap:8px; color:var(--dim); white-space:nowrap; }
  .bar{ width:120px; height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; }
  .bar i{ display:block; height:100%; width:0; background:var(--good); transition:width .25s; }
  .spacer{ flex:1; }
  .back{ color:var(--dim); text-decoration:none; white-space:nowrap; }
  .back:hover{ color:var(--text); }
  .list-toggle{ display:none; }

  .list{ grid-area:list; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:10px; }
  .list h3{ margin:12px 4px 8px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }
  .list h3:first-child{ margin-top:2px; }
  .game{ display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel-2); border-radius:9px; padding:9px 10px; margin-bottom:6px; }
  .game:hover{ border-color:var(--faint); }
  .game.on{ border-color:var(--accent); background:var(--accent-soft); }
  .dot{ flex:none; width:10px; height:10px; margin-top:4px; border-radius:50%; background:transparent; box-shadow:inset 0 0 0 2px var(--faint); }
  .dot.works{ background:var(--good); box-shadow:none; }
  .dot.problem{ background:var(--bad); box-shadow:none; }
  .game-main{ min-width:0; flex:1; }
  .game-name{ font-weight:600; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .game-meta{ color:var(--faint); font-size:12px; overflow-wrap:anywhere; }
  .tag{ font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:1px 5px; border-radius:5px; background:var(--panel); color:var(--faint); }
  .tag.off{ color:var(--bad); }
  .game-meta, .game-note{ display:block; }
  .game-note{ margin-top:3px; font-size:12px; color:#ffb3ab; }

  .stage{ grid-area:stage; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
  .toolbar h2{ margin:0 6px 0 0; font-size:15px; }
  .seg{ display:inline-flex; border:1px solid var(--line-2); border-radius:7px; overflow:hidden; }
  .seg button{ border:0; background:var(--panel-2); padding:5px 11px; color:var(--dim); }
  .seg button.on{ background:var(--accent-soft); color:var(--accent); }
  .btn{ border:1px solid var(--line-2); background:var(--panel-2); border-radius:7px; padding:5px 11px; }
  .btn:hover:not(:disabled){ border-color:var(--faint); }
  .btn:disabled{ opacity:.4; cursor:default; }
  .timer{ font:12px var(--mono); color:var(--dim); min-width:70px; }
  .run{ font-weight:600; }
  .run.good{ color:var(--good); } .run.bad{ color:var(--bad); }
  .frame-area{ flex:1; position:relative; overflow:hidden; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 30%, #151a22, #0a0c10 70%); min-height:0; }
  .device{ position:absolute; left:50%; top:50%; border-radius:18px; overflow:hidden; background:#000; box-shadow:0 0 0 10px #1c2027, 0 0 0 11px #2c313a, 0 20px 60px rgba(0,0,0,.6); transform-origin:center; }
  .device.fill{ border-radius:0; box-shadow:none; }
  .device iframe{ width:100%; height:100%; border:0; display:block; background:#000; }
  .empty{ color:var(--faint); text-align:center; padding:20px; }
  .verdict{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:9px 14px; border-top:1px solid var(--line); background:var(--panel); }
  .verdict .q{ color:var(--dim); }
  .vbtn{ border:1px solid var(--line-2); background:var(--panel-2); border-radius:7px; padding:5px 12px; }
  .vbtn.works.on{ border-color:var(--good); background:var(--good-soft); color:var(--good); }
  .vbtn.problem.on{ border-color:var(--bad); background:var(--bad-soft); color:var(--bad); }
  .verdict textarea{ flex:1 1 260px; min-width:0; height:34px; resize:vertical; background:var(--panel-2); border:1px solid var(--line-2); border-radius:7px; padding:6px 8px; outline:none; }
  .verdict textarea:focus{ border-color:var(--accent); }

  @media (max-width:820px){
    body{ grid-template-columns:1fr; grid-template-areas:"top" "stage"; }
    .list{ position:fixed; left:0; top:45px; bottom:0; width:min(320px, 88vw); z-index:20; transform:translateX(-100%); transition:transform .2s; box-shadow:8px 0 24px rgba(0,0,0,.5); }
    .list.open{ transform:none; }
    .list-toggle{ display:inline-block; }
    .bar{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ .list, .bar i{ transition:none; } }
</style>
</head>
<body>
  <header class="top">
    <button class="btn list-toggle" id="listToggle">Minigames</button>
    <span class="brand">Minigame test bench</span>
    <span class="progress"><span class="bar"><i id="barFill"></i></span><span id="progressText">0 of 0 checked</span></span>
    <span class="spacer"></span>
    <a class="back" href="/waiting">&larr; Lobby</a>
  </header>

  <nav class="list" id="list" aria-label="Minigames"></nav>

  <main class="stage">
    <div class="toolbar">
      <h2 id="title">Pick a minigame</h2>
      <div class="seg" id="sizes" role="group" aria-label="Screen size">
        <button data-size="phone" class="on" title="Phone, upright (1)">Phone</button>
        <button data-size="land" title="Phone, sideways (2)">Landscape</button>
        <button data-size="tablet" title="Tablet (3)">Tablet</button>
        <button data-size="fill" title="Fill this area (4)">Fill</button>
      </div>
      <button class="btn" id="restart" title="Restart (R)" disabled>Restart</button>
      <div class="seg" id="tank" role="group" aria-label="Fuel tank" hidden>
        <button data-tank="full" class="on">Tank full</button><button data-tank="empty">Tank empty</button>
      </div>
      <a class="btn" id="newTab" target="_blank" rel="noopener" hidden>Open in a new tab</a>
      <span class="spacer"></span>
      <span class="timer" id="timer"></span>
      <span class="run" id="run" role="status" aria-live="polite"></span>
    </div>
    <div class="frame-area" id="area">
      <div class="empty" id="empty">Choose a minigame from the list to play it here.<br>Nothing you do here is recorded in a game.</div>
      <div class="device" id="device" hidden><iframe id="frame" title="Minigame preview"></iframe></div>
    </div>
    <div class="verdict" id="verdict" hidden>
      <span class="q">Does it work?</span>
      <button class="vbtn works" data-v="works">Works</button>
      <button class="vbtn problem" data-v="problem">Has a problem</button>
      <textarea id="note" placeholder="What went wrong? (saved in this browser)" hidden></textarea>
      <button class="btn" id="next" title="Next unchecked minigame (N)">Next unchecked &rarr;</button>
    </div>
  </main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var SIZES = { phone:[390, 844], land:[844, 390], tablet:[820, 1180] };
  var KEY = 'minigame-test-results';
  var games = [], current = null, size = 'phone', tank = 'full', runId = 0, started = 0, timerT = 0, finished = false;
  var results = {};
  try { results = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { results = {}; }
  function saveResults(){ try { localStorage.setItem(KEY, JSON.stringify(results)); } catch (e) {} }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

  function meta(g){
    var bits = [];
    if (g.draft) bits.push('draft, not a task');
    if (g.repeat > 1) bits.push('repeats ×' + g.repeat);
    if (g.chain) bits.push('part of ' + g.chain.join(' → '));
    var locs = (g.locations || []).filter(Boolean);
    if (locs.length) bits.push(locs.join(', '));
    return bits.join(' · ');
  }
  function renderList(){
    var tasks = games.filter(function(g){ return !g.draft; }), drafts = games.filter(function(g){ return g.draft; });
    var item = function(g){
      var r = results[g.id] || {};
      return '<button class="game' + (current && current.id === g.id ? ' on' : '') + '" data-id="' + esc(g.id) + '">'
        + '<span class="dot ' + (r.status || '') + '" aria-label="' + (r.status === 'works' ? 'Works' : r.status === 'problem' ? 'Has a problem' : 'Not checked') + '"></span>'
        + '<span class="game-main"><span class="game-name">' + esc(g.name) + (g.enabled === false && !g.draft ? ' <span class="tag off">Off</span>' : '') + '</span>'
        + '<span class="game-meta">' + esc(g.id) + (meta(g) ? ' · ' + esc(meta(g)) : '') + '</span>'
        + (r.status === 'problem' && r.note ? '<span class="game-note">' + esc(r.note) + '</span>' : '') + '</span></button>';
    };
    $('list').innerHTML = '<h3>Tasks</h3>' + tasks.map(item).join('') + (drafts.length ? '<h3>Drafts</h3>' + drafts.map(item).join('') : '');
    var checked = tasks.filter(function(g){ return results[g.id] && results[g.id].status; }).length;
    $('progressText').textContent = checked + ' of ' + tasks.length + ' checked';
    $('barFill').style.width = (tasks.length ? checked / tasks.length * 100 : 0) + '%';
  }
  function renderVerdict(){
    if (!current) return;
    var r = results[current.id] || {};
    document.querySelectorAll('.vbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.v === r.status); });
    $('note').hidden = r.status !== 'problem';
    if (document.activeElement !== $('note')) $('note').value = r.note || '';
  }

  // Device frame: real pixel size, scaled down to fit the area.
  function layout(){
    var dev = $('device'), area = $('area');
    if (dev.hidden) return;
    var aw = area.clientWidth, ah = area.clientHeight;
    if (size === 'fill'){ dev.className = 'device fill'; dev.style.width = aw + 'px'; dev.style.height = ah + 'px'; dev.style.transform = 'translate(-50%,-50%)'; return; }
    var s = SIZES[size], k = Math.min(1, (aw - 48) / s[0], (ah - 48) / s[1]);
    dev.className = 'device';
    dev.style.width = s[0] + 'px'; dev.style.height = s[1] + 'px';
    dev.style.transform = 'translate(-50%,-50%) scale(' + k + ')';
  }

  function play(g){
    current = g; finished = false; runId++;
    $('title').textContent = g.name;
    $('empty').hidden = true; $('device').hidden = false; $('verdict').hidden = false;
    $('restart').disabled = false;
    $('tank').hidden = g.id !== 'fuel_engine';
    var url = '/minigames/play/' + encodeURIComponent(g.id) + '?tank=' + tank + '&run=' + runId;
    $('newTab').hidden = false; $('newTab').href = url;
    $('run').textContent = ''; $('run').className = 'run';
    $('timer').textContent = '';
    $('frame').src = url;
    layout(); renderList(); renderVerdict();
    $('list').classList.remove('open');
  }
  $('frame').addEventListener('load', function(){
    if (!current) return;
    started = performance.now();
    clearInterval(timerT);
    timerT = setInterval(function(){ if (!finished) $('timer').textContent = ((performance.now() - started) / 1000).toFixed(1) + ' s'; }, 100);
  });
  window.addEventListener('message', function(e){
    if (e.origin !== location.origin || e.source !== $('frame').contentWindow || !e.data) return;
    if (e.data.type === 'minigame-complete' && !finished){
      finished = true;
      var t = ((performance.now() - started) / 1000).toFixed(1);
      $('timer').textContent = t + ' s';
      $('run').textContent = '✓ Finished in ' + t + ' s';
      $('run').className = 'run good';
    } else if (e.data.type === 'minigame-error'){
      $('run').textContent = '✕ Error: ' + e.data.message;
      $('run').className = 'run bad';
    }
  });

  function nextUnchecked(){
    var list = games.filter(function(g){ return !g.draft; });
    var start = current ? list.findIndex(function(g){ return g.id === current.id; }) : -1;
    for (var i = 1; i <= list.length; i++){
      var g = list[(start + i) % list.length];
      if (!(results[g.id] && results[g.id].status)){ play(g); return; }
    }
    $('run').textContent = 'Every minigame has been checked.'; $('run').className = 'run good';
  }

  $('list').addEventListener('click', function(e){
    var b = e.target.closest('.game');
    if (!b) return;
    var g = games.find(function(x){ return x.id === b.dataset.id; });
    if (g) play(g);
  });
  $('sizes').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    size = b.dataset.size;
    document.querySelectorAll('#sizes button').forEach(function(x){ x.classList.toggle('on', x === b); });
    layout();
  });
  $('tank').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    tank = b.dataset.tank;
    document.querySelectorAll('#tank button').forEach(function(x){ x.classList.toggle('on', x === b); });
    if (current) play(current);
  });
  $('restart').addEventListener('click', function(){ if (current) play(current); });
  $('next').addEventListener('click', nextUnchecked);
  document.querySelectorAll('.vbtn').forEach(function(b){
    b.addEventListener('click', function(){
      if (!current) return;
      var r = results[current.id] || {};
      r.status = r.status === b.dataset.v ? '' : b.dataset.v;
      r.at = new Date().toISOString();
      results[current.id] = r;
      saveResults(); renderList(); renderVerdict();
      if (r.status === 'problem') $('note').focus();
    });
  });
  $('note').addEventListener('input', function(){
    if (!current) return;
    var r = results[current.id] || { status:'problem' };
    r.note = $('note').value;
    results[current.id] = r;
    saveResults(); renderList();
  });
  $('listToggle').addEventListener('click', function(){ $('list').classList.toggle('open'); });
  document.addEventListener('keydown', function(e){
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === 'r' && current) play(current);
    else if (k === 'n') nextUnchecked();
    else if (k >= '1' && k <= '4') document.querySelectorAll('#sizes button')[+k - 1].click();
  });
  window.addEventListener('resize', layout);

  fetch('/minigames/list').then(function(r){ return r.json().then(function(d){ if (!r.ok) throw new Error(d.error || 'Could not load the minigames.'); return d; }); })
    .then(function(d){ games = d.games || []; renderList(); })
    .catch(function(err){ $('empty').innerHTML = esc(err.message) + ' <a href="/host" style="color:#ffb02e">Log in as host</a>'; });
})();
</script>
</body>
</html>
