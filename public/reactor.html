<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reactor Core Control</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/serverdevice.js"></script>
    <script src="/alarmaudio.js"></script>
    <style>
        :root {
            --bg: #07090a; --panel: #0e1311; --edge: #22302a; --text: #dbe7df; --dim: #6c8577;
            --green: #39ff6a; --red: #ff3333; --amber: #fbbf24;
            --c: var(--green);
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", "Courier New", monospace;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; user-select: none; -webkit-user-select: none; }
        body.crisis { --c: var(--red); }

        #overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(255, 0, 0, 0.5) 100%);
        }
        body.crisis #overlay { animation: flash 1s infinite; }
        @keyframes flash { 0%, 100% { opacity: 0.15; } 50% { opacity: 1; } }

        .connect { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg); }
        .connect[hidden] { display: none; }
        .btn-connect {
            font: 700 1.1rem var(--mono); letter-spacing: 0.12em; padding: 18px 34px; cursor: pointer;
            color: var(--green); background: transparent; border: 2px solid var(--green); border-radius: 6px;
            box-shadow: 0 0 14px rgba(57, 255, 106, 0.3);
        }
        .btn-connect:hover, .btn-connect:focus-visible { background: var(--green); color: #04150a; outline: none; }

        .console {
            position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; gap: 14px;
            padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        }
        .bar {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            font-size: 0.78rem; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase;
            border-bottom: 1px solid var(--edge); padding-bottom: 10px;
        }
        .bar b { color: var(--text); }
        .lamp { display: inline-flex; align-items: center; gap: 8px; color: var(--c); }
        .lamp i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
        body.crisis .lamp i { animation: blink 0.5s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0.15; } }

        .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 22px; align-content: center; justify-items: center; }
        body.crisis .main { grid-template-columns: auto minmax(0, 1fr); align-items: center; }

        /* QR */
        .qr { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .qr[hidden] { display: none; }
        .qr-frame {
            --s: min(62vh, 44vw);
            width: var(--s); height: var(--s); padding: 14px; background: #fff; border-radius: 10px; position: relative;
            box-shadow: 0 0 0 4px #1a1a1a, 0 0 0 7px var(--red), 0 0 36px rgba(255, 51, 51, 0.5);
        }
        .qr-frame img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
        .qr-frame img:not([src]) { visibility: hidden; }
        .qr-frame .scanline {
            position: absolute; left: 6px; right: 6px; height: 2px; top: 10%; background: rgba(255, 51, 51, 0.7);
            box-shadow: 0 0 8px rgba(255, 51, 51, 0.9); animation: scan 2.4s ease-in-out infinite alternate; pointer-events: none;
        }
        @keyframes scan { to { top: 90%; } }
        .qr-link {
            width: min(46vw, 520px); padding: 18px; border-radius: 10px; background: #120707; border: 1px dashed var(--red);
            display: flex; flex-direction: column; gap: 12px; text-align: center;
        }
        .qr-link[hidden], .qr-frame[hidden] { display: none; }
        .qr-link small { font-size: 0.7rem; letter-spacing: 0.22em; color: var(--amber); }
        .qr-link a { color: #fff; font-size: 1rem; line-height: 1.4; word-break: break-all; user-select: text; -webkit-user-select: text; }
        .qr-link a:focus-visible, .qr-link button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
        .qr-link button {
            align-self: center; font: 700 0.8rem var(--mono); letter-spacing: 0.14em; padding: 9px 16px; cursor: pointer;
            color: var(--amber); background: transparent; border: 1px solid var(--amber); border-radius: 6px;
        }
        .qr-label { font-size: 0.82rem; letter-spacing: 0.22em; color: var(--red); font-weight: 700; text-align: center; }

        .status { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; min-width: 0; width: 100%; }
        #state {
            font-size: clamp(1.7rem, 5.4vw, 3.6rem); font-weight: 800; letter-spacing: 0.06em; line-height: 1.05;
            color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 55%, transparent);
        }
        body.crisis #state { animation: pulse 1s infinite alternate; }
        @keyframes pulse { to { transform: scale(1.03); } }
        #clock { font-size: clamp(3rem, 11vw, 6.5rem); font-weight: 800; color: var(--red); line-height: 1; font-variant-numeric: tabular-nums; }
        #clock[hidden] { display: none; }

        .readout { display: flex; gap: 22px; font-size: 0.78rem; letter-spacing: 0.16em; color: var(--dim); }
        .readout b { display: block; margin-top: 4px; font-size: 1.15rem; color: var(--c); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }

        .levers { display: flex; flex-direction: column; gap: 10px; width: min(440px, 100%); }
        .levers[hidden] { display: none; }
        .slots { display: flex; gap: 10px; }
        .slot {
            flex: 1; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
            background: var(--panel); border: 1px solid #3a1d1d; font-size: 0.8rem; letter-spacing: 0.14em; color: var(--dim);
            transition: border-color 0.2s, box-shadow 0.2s, color 0.2s;
        }
        .slot i { width: 12px; height: 12px; border-radius: 50%; background: #3b1616; flex: none; transition: background 0.2s, box-shadow 0.2s; }
        .slot.on { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 14px rgba(251, 191, 36, 0.25); }
        .slot.on i { background: var(--amber); box-shadow: 0 0 10px var(--amber); }
        .stab-label { display: flex; justify-content: space-between; font-size: 0.72rem; letter-spacing: 0.2em; color: var(--dim); }
        .stab-track { height: 12px; background: #050807; border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; }
        .stab-fill { height: 100%; width: 0; background: var(--green); box-shadow: 0 0 10px var(--green); }
        .hint { margin: 0; max-width: 44ch; font-size: 0.8rem; line-height: 1.45; color: var(--dim); }
        .hint[hidden] { display: none; }

        @media (max-height: 500px) {
            .console { gap: 8px; }
            .qr-frame { --s: min(70vh, 40vw); padding: 8px; }
            body.crisis #state { font-size: 1.5rem; }
            body.crisis #clock { font-size: 2.6rem; }
            .status { gap: 8px; }
            .hint { display: none !important; }
        }
        @media (max-width: 720px) and (min-height: 501px) {
            body.crisis .main { grid-template-columns: 1fr; align-content: start; overflow-y: auto; gap: 14px; }
            .qr-frame { --s: min(78vw, 46vh); }
            body.crisis #state { font-size: 1.6rem; }
            body.crisis #clock { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div id="overlay"></div>

    <div class="connect" id="connect">
        <button id="start-btn" class="btn-connect" type="button">CONNECT TO REACTOR FEED</button>
    </div>

    <div class="console">
        <div class="bar">
            <span><b>REACTOR</b> // CORE CONTROL</span>
            <span class="lamp"><i></i><span id="lampText">NOMINAL</span></span>
        </div>
        <div class="main">
            <section class="qr" id="qr" hidden>
                <div class="qr-frame" role="img" aria-label="Reactor manual override QR code"><img id="qrImg" alt=""><div class="scanline"></div></div>
                <div class="qr-link" id="qrLink" hidden>
                    <small>TEST MODE · OVERRIDE LINK</small>
                    <a id="qrUrl" href="#" target="_blank" rel="noopener"></a>
                    <button type="button" id="qrCopy">COPY LINK</button>
                </div>
                <div class="qr-label" id="qrLabel">SCAN FOR MANUAL OVERRIDE</div>
            </section>

            <section class="status" aria-live="polite">
                <div id="state">REACTOR STABLE</div>
                <div id="clock" hidden>1:30</div>
                <div class="readout">
                    <div>CORE TEMP<b id="temp">612°C</b></div>
                    <div>OUTPUT<b id="output">100%</b></div>
                </div>
                <div class="levers" id="levers" hidden>
                    <div class="slots" id="slots"></div>
                    <div>
                        <div class="stab-label"><span id="stabText">MANUAL OVERRIDE</span><span id="stabPct"></span></div>
                        <div class="stab-track"><div class="stab-fill" id="stabFill"></div></div>
                    </div>
                </div>
                <p class="hint" id="hint" hidden>Two crewmates scan the code, then hold their override levers down at the same time.</p>
            </section>
        </div>
    </div>


    <script>
        const $ = id => document.getElementById(id);
        let socket = null, audio = null;   // the alarm itself plays from serverdevice.js / alarmaudio.js
        let state = 'stable';   // stable | crisis | restored | game-over
        let endTime = 0, total = 0, need = 2, holding = 0, since = 0, holdMs = 3000, qrId = null;
        let restoredTimer = null;

        function tone(freq, ms, type, gain) {
            if (!audio) return;
            const o = audio.createOscillator(), g = audio.createGain();
            o.type = type || 'sine'; o.frequency.value = freq;
            g.gain.setValueAtTime(gain || 0.08, audio.currentTime);
            g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + ms / 1000);
            o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + ms / 1000);
        }

        function fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

        function renderSlots() {
            const box = $('slots'); box.innerHTML = '';
            for (let i = 0; i < need; i++) {
                const s = document.createElement('div');
                const on = i < holding;
                s.className = 'slot' + (on ? ' on' : '');
                s.innerHTML = '<i></i><span></span>';
                s.querySelector('span').textContent = 'LEVER ' + String.fromCharCode(65 + i) + ': ' + (on ? 'HELD' : 'OPEN');
                box.appendChild(s);
            }
        }

        function tick() {
            const now = Date.now();
            if (state === 'crisis') {
                const left = Math.max(0, (endTime - now) / 1000);
                $('clock').textContent = fmt(left);
                const heat = total > 0 ? 1 - Math.max(0, Math.min(1, left / total)) : 0;
                const jitter = (Math.floor(now / 700) * 7) % 9;
                $('temp').textContent = (2400 + Math.round(heat * 2600) + jitter).toLocaleString('en-US') + '°C';
                $('output').textContent = (100 + Math.round(heat * 180)) + '%';
                if (since > 0) {
                    const p = Math.min(1, (now - since) / holdMs);
                    $('stabFill').style.width = (p * 100) + '%';
                    $('stabPct').textContent = Math.round(p * 100) + '%';
                    $('stabText').textContent = 'STABILISING';
                } else {
                    $('stabFill').style.width = '0';
                    $('stabPct').textContent = '';
                    $('stabText').textContent = holding ? 'WAITING FOR ' + (need - holding) + ' MORE' : 'MANUAL OVERRIDE';
                }
            } else if (state === 'stable') {
                $('temp').textContent = (612 + (Math.floor(now / 1500) * 5) % 6) + '°C';
            }
        }

        // A QR code normally; with the server's test mode on, the plain link instead.
        let qrLoading = false, qrShown = false;
        async function loadQr() {
            if (qrLoading) return;
            qrLoading = true; qrShown = true;
            try {
                const res = await fetch('/reactor/override', { cache: 'no-store' });
                if (!res.ok) throw new Error(res.status);
                const how = await res.json();
                if (state !== 'crisis') return;
                const link = how.mode === 'link';
                document.querySelector('.qr-frame').hidden = link;
                $('qrLink').hidden = !link;
                $('qrLabel').textContent = link ? 'OPEN ON A PLAYER\'S PHONE' : 'SCAN FOR MANUAL OVERRIDE';
                $('hint').textContent = link ? 'Two crewmates open the link, then hold their override levers down at the same time.'
                    : 'Two crewmates scan the code, then hold their override levers down at the same time.';
                if (link) { $('qrUrl').textContent = how.url; $('qrUrl').href = how.url; }
                else $('qrImg').src = '/reactor/qr.svg?q=' + encodeURIComponent(qrId || Date.now());
            } catch (e) {
                qrShown = false;
                if (state === 'crisis') setTimeout(loadQr, 1500);
            } finally {
                qrLoading = false;
            }
        }
        $('qrCopy').addEventListener('click', () => {
            const url = $('qrUrl').href;
            const done = () => { $('qrCopy').textContent = 'COPIED'; setTimeout(() => { $('qrCopy').textContent = 'COPY LINK'; }, 1500); };
            if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => {});
            else { const r = document.createRange(); r.selectNodeContents($('qrUrl')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); try { document.execCommand('copy'); done(); } catch (e) {} }
        });

        function setState(next) {
            if (state === next) return;
            state = next;
            const crisis = next === 'crisis';
            document.body.classList.toggle('crisis', crisis);
            $('clock').hidden = !crisis;
            $('qr').hidden = !crisis;
            $('levers').hidden = !crisis;
            $('hint').hidden = !crisis;
            if (crisis) {
                $('state').textContent = 'REACTOR MELTDOWN';
                $('lampText').textContent = 'ALARM';
                renderSlots();
                if (socket) socket.emit('unstable', { activated: true });
            } else {
                $('qrImg').removeAttribute('src');
                $('qrUrl').textContent = ''; $('qrUrl').href = '#';
                qrId = null; qrShown = false; holding = 0; since = 0;
                $('output').textContent = '100%';
                if (next === 'restored') { $('state').textContent = 'REACTOR STABILISED'; $('lampText').textContent = 'RESTORED'; }
                else if (next === 'stable') { $('state').textContent = 'REACTOR STABLE'; $('lampText').textContent = 'NOMINAL'; }
                else $('lampText').textContent = 'OFFLINE';
            }
            tick();
        }
        function restored() {
            if (state !== 'crisis') return;
            [520, 700, 880, 1040].forEach((f, i) => setTimeout(() => tone(f, 180, 'sine', 0.12), i * 130));
            setState('restored');
            clearTimeout(restoredTimer);
            restoredTimer = setTimeout(() => { if (state === 'restored') setState('stable'); }, 4000);
        }

        function setupSocketListeners() {
            socket.on('sabotage_data_request', ({ sData, endTime: end }) => {
                const r = sData && sData.reactor;
                if (!r || state === 'game-over') return;
                if (r.sabotaged && r.meltdown) {
                    endTime = end || endTime;
                    if (!total) total = Math.max(1, Math.round((endTime - Date.now()) / 1000));
                    setState('crisis');
                    if (!qrShown) loadQr();
                } else if (state === 'crisis') {
                    restored();
                }
            });
            socket.on('reactor_override_status', st => {
                if (!st || !st.active || state === 'game-over') return;
                if (st.total) total = st.total;
                need = st.need || need; holdMs = st.holdMs || holdMs;
                const before = holding;
                holding = st.holding || 0;
                if (holding > before) tone(440 + holding * 160, 120, 'square', 0.05);
                since = st.since || 0;
                if (st.qr && st.qr !== qrId) { qrId = st.qr; if (state === 'crisis') loadQr(); }
                renderSlots(); tick();
            });
            socket.on('sabotage_fixed', d => { if (d && d.type === 'reactor') restored(); });
            socket.on('reactor_meltdown', stopForGameOver);
            socket.on('game_over', stopForGameOver);
            socket.on('Err', err => console.error('Server error:', err.error));
        }

        function resetToStable() {
            clearTimeout(restoredTimer);
            total = 0; holding = 0; since = 0; qrId = null; qrShown = false;
            state = '';
            setState('stable');
        }
        // The game ended for any reason: stop everything; serverdevice.js shows the result.
        function stopForGameOver() {
            if (state === 'game-over') return;
            setState('game-over');
        }

        $('qrImg').addEventListener('error', () => { if (state === 'crisis') setTimeout(loadQr, 1500); });

        $('start-btn').addEventListener('click', () => {
            $('connect').hidden = true;
            try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
            socket = io();
            setupSocketListeners();
            // game over / restart happen on this page, so sound stays allowed to play
            ServerDevice.attach(socket, { role: 'reactor', audio, onGameOver: stopForGameOver, onReset: resetToStable });
            setInterval(tick, 200);
        });
    </script>
</body>
</html>
