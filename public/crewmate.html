<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crewmate Tablet</title>
    <link rel="stylesheet" href="common.css">
    <style>
        :root {
            --metal-1: #f4f6f9;
            --metal-2: #d9dfe6;
            --metal-3: #b7bfc9;
            --metal-edge: #8b93a1;
            --metal-shadow: #5b6472;
            --screw-color: #9aa3b0;
            --screen-bg-top: #10161d;
            --screen-bg-bottom: #060a0e;
            --screen-text: #e2e8f0;
            --lcd-accent: #5eead4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --shadow-hardware: 0 14px 34px rgba(15, 23, 42, 0.28), inset 0 2px 2px rgba(255, 255, 255, 0.65), inset 0 -6px 10px rgba(91, 100, 114, 0.35);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #cbd5e1;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 16px 16px;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tablet-chassis {
            width: 100%;
            max-width: 410px;
            margin: 0 auto;
            background:
                repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.55) 0px, rgba(255, 255, 255, 0.55) 1px, transparent 1px, transparent 3px),
                linear-gradient(160deg, var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
            border: 1px solid var(--metal-edge);
            border-radius: 30px;
            padding: 22px 18px 20px;
            box-shadow: var(--shadow-hardware);
            position: relative;
        }

        .antenna {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 16px;
            background: linear-gradient(180deg, var(--metal-2), var(--metal-3));
            border: 1px solid var(--metal-edge);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
        }

        .screw {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f1f4f8, var(--screw-color) 60%, #6b7280 100%);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(255, 255, 255, 0.6);
        }
        .screw::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 15%;
            width: 70%;
            height: 1px;
            background: rgba(0, 0, 0, 0.4);
            transform: translateY(-50%) rotate(35deg);
        }
        .screw-tl { top: 12px; left: 12px; }
        .screw-tr { top: 12px; right: 12px; }
        .screw-bl { bottom: 12px; left: 12px; }
        .screw-br { bottom: 12px; right: 12px; }

        .status-light-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .sensor-dot {
            width: 7px;
            height: 7px;
            background-color: var(--metal-shadow);
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
        }
        .sensor-light {
            width: 9px;
            height: 9px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green), inset 0 -1px 1px rgba(0, 0, 0, 0.3);
        }
        .sensor-caption {
            text-align: center;
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            color: var(--metal-shadow);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .screen-bezel {
            background: linear-gradient(180deg, #1c2128, #05070a);
            border: 1px solid #05070a;
            border-radius: 18px;
            padding: 6px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 3px 6px rgba(0, 0, 0, 0.3);
        }
        .screen-inner {
            position: relative;
            background: linear-gradient(175deg, var(--screen-bg-top), var(--screen-bg-bottom));
            border-radius: 13px;
            padding: 16px;
            color: var(--screen-text);
            box-shadow: inset 0 0 16px rgba(0, 0, 0, 0.85);
            overflow: hidden;
        }
        .screen-inner::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 3px);
        }

        .shatter-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 5;
        }
        .shatter-overlay.active {
            opacity: 1;
        }
        .crack-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .blood-stain {
            position: absolute;
            mix-blend-mode: multiply;
            filter: blur(0.4px);
            border-radius: 50%;
            background: radial-gradient(ellipse at 35% 30%, rgba(139, 10, 10, 0.9) 0%, rgba(95, 5, 5, 0.75) 55%, rgba(60, 3, 3, 0.45) 80%, transparent 100%);
        }
        .blood-drip {
            position: absolute;
            mix-blend-mode: multiply;
            filter: blur(0.3px);
            border-radius: 40% 40% 20% 20%;
            background: radial-gradient(ellipse at 50% 20%, rgba(139, 10, 10, 0.85) 0%, rgba(80, 5, 5, 0.6) 60%, transparent 100%);
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 10px;
            margin-bottom: 12px;
            position: relative;
        }
        .screen-header h1 {
            font-size: 1.15rem;
            color: var(--accent-blue);
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .status-pill {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-alive {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        .status-dead {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }

        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #1e293b;
            margin-bottom: 14px;
            position: relative;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
        }
        .info-row span:last-child {
            color: var(--lcd-accent);
            font-weight: 600;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            letter-spacing: 0.5px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #1e293b;
            margin-bottom: 14px;
            position: relative;
        }
        .task-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .task-label span:last-child {
            color: var(--lcd-accent);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        .progress-track {
            width: 100%;
            height: 12px;
            background-color: #0f172a;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #059669, #10b981);
            border-radius: 20px;
            transition: width 0.5s ease;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
        }
        .progress-fill.personal {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        .emergency-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .emergency-label {
            font-size: 0.9rem;
            color: #e2e8f0;
            font-weight: 600;
        }
        .meeting-badge {
            font-size: 0.85rem;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .meeting-idle {
            background-color: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
            border: 1px solid #475569;
        }
        .meeting-active {
            background-color: rgba(239, 68, 68, 0.25);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            animation: pulse-border 1.2s infinite alternate;
        }
        @keyframes pulse-border {
            from { box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
            to { box-shadow: 0 0 12px rgba(239, 68, 68, 0.9); }
        }

        .button-deck {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
            padding: 10px 6px 2px;
        }
        .deco-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--metal-1), var(--metal-3));
            border: 1px solid var(--metal-edge);
            box-shadow: 0 2px 0 var(--metal-shadow), inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        .deco-btn.small {
            width: 16px;
            height: 16px;
            align-self: center;
        }

        .btn-action-wrap {
            margin-top: 16px;
        }
        .btn-action {
            width: 100%;
            padding: 13px;
            background: linear-gradient(180deg, #fef2f2 0%, #fecaca 100%);
            border: 1px solid #f0a3a3;
            color: #7f1d1d;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #d97b7b, inset 0 1px 1px rgba(255, 255, 255, 0.8);
            transition: all 0.1s ease;
            font-family: inherit;
        }
        .btn-action:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #d97b7b, inset 0 1px 1px rgba(255, 255, 255, 0.8);
        }
        .btn-action:disabled {
            opacity: 0.6;
            transform: translateY(2px);
            box-shadow: 0 3px 0 #d97b7b;
            cursor: not-allowed;
            pointer-events: none;
        }

        .brand-plate {
            text-align: center;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--metal-shadow);
            font-weight: 700;
            margin-top: 14px;
            opacity: 0.7;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(6px);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #334155;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-msg.error {
            border-color: #ef4444;
            color: #fca5a5;
        }
        .toast-msg.success {
            border-color: #10b981;
            color: #6ee7b7;
        }
    </style>
</head>
<body>

    <div class="tablet-chassis">
        <div class="antenna"></div>
        <div class="screw screw-tl"></div>
        <div class="screw screw-tr"></div>
        <div class="screw screw-bl"></div>
        <div class="screw screw-br"></div>

        <div class="status-light-bar">
            <div class="sensor-dot"></div>
            <div class="sensor-light"></div>
            <div class="sensor-dot"></div>
        </div>
        <div class="sensor-caption">iMira</div>

        <div class="screen-bezel">
            <div class="screen-inner">
                <div class="shatter-overlay" id="shatterOverlay">
                    <img src="image.jpg" class="crack-overlay" alt="" draggable="false">
                    <div class="blood-stain" style="top:8%;left:58%;width:30px;height:24px;transform:rotate(12deg)"></div>
                    <div class="blood-drip" style="top:22%;left:66%;width:4px;height:26px;transform:rotate(6deg)"></div>
                    <div class="blood-stain" style="top:55%;left:12%;width:20px;height:16px;transform:rotate(-20deg)"></div>
                    <div class="blood-drip" style="top:62%;left:16%;width:3px;height:18px;transform:rotate(-8deg)"></div>
                    <div class="blood-stain" style="bottom:6%;right:10%;width:16px;height:13px;transform:rotate(35deg)"></div>
                    <div class="blood-stain" style="top:15%;left:18%;width:54px;height:42px;transform:rotate(-18deg)"></div>
                    <div class="blood-stain" style="bottom:18%;left:70%;width:48px;height:36px;transform:rotate(28deg)"></div>
                    <div class="blood-stain" style="top:42%;right:8%;width:60px;height:48px;transform:rotate(-40deg)"></div>
                    <div class="blood-stain" style="top:30%;left:42%;width:28px;height:22px;transform:rotate(65deg)"></div>
                    <div class="blood-stain" style="bottom:28%;right:42%;width:26px;height:20px;transform:rotate(-12deg)"></div>
                    <div class="blood-stain" style="top:72%;left:36%;width:24px;height:19px;transform:rotate(90deg)"></div>
                    <div class="blood-stain" style="top:12%;left:24%;width:8px;height:7px;transform:rotate(14deg)"></div>
                    <div class="blood-stain" style="top:48%;left:76%;width:6px;height:6px;transform:rotate(-15deg)"></div>
                    <div class="blood-stain" style="bottom:14%;left:48%;width:9px;height:8px;transform:rotate(52deg)"></div>
                    <div class="blood-stain" style="top:66%;right:18%;width:7px;height:6px;transform:rotate(-75deg)"></div>
                    <div class="blood-drip" style="top:18%;left:20%;width:5px;height:48px;transform:rotate(-4deg)"></div>
                    <div class="blood-drip" style="top:34%;right:14%;width:4px;height:40px;transform:rotate(8deg)"></div>
                    <div class="blood-drip" style="bottom:22%;left:74%;width:6px;height:56px;transform:rotate(-2deg)"></div>
                    <div class="blood-drip" style="top:26%;left:46%;width:2px;height:14px;transform:rotate(12deg)"></div>
                    <div class="blood-drip" style="bottom:10%;left:30%;width:3px;height:20px;transform:rotate(-10deg)"></div>
                    <div class="blood-drip" style="top:58%;right:26%;width:2px;height:16px;transform:rotate(5deg)"></div>
                </div>

                <div class="screen-header">
                    <h1>Crew Terminal</h1>
                    <span id="alive-badge" class="status-pill status-alive">Alive</span>
                </div>

                <div class="info-grid">
                    <div class="info-row">
                        <span>Username:</span>
                        <span id="usr">---</span>
                    </div>
                    <div class="info-row">
                        <span>Player ID:</span>
                        <span id="id">---</span>
                    </div>
                </div>

                <div class="task-card">
                    <div class="task-label">
                        <span>Personal Tasks</span>
                        <span id="tasksCompleted">0/0</span>
                    </div>
                    <div class="progress-track">
                        <div id="personalTaskProgressBar" class="progress-fill personal"></div>
                    </div>
                </div>

                <div class="task-card">
                    <div class="task-label">
                        <span>Total Crew Tasks</span>
                        <span id="totalTasks">0/0</span>
                    </div>
                    <div class="progress-track">
                        <div id="taskProgressBar" class="progress-fill"></div>
                    </div>
                </div>

                <div class="emergency-panel">
                    <span class="emergency-label">Emergency Meeting</span>
                    <span id="emergencyMeetingStatus" class="meeting-badge meeting-idle">Ready</span>
                </div>
            </div>
        </div>

        <div class="button-deck">
            <div class="deco-btn small"></div>
            <div class="deco-btn"></div>
            <div class="deco-btn small"></div>
        </div>

        <div class="btn-action-wrap">
            <button id="actionBtn" class="btn-action">I'm dead</button>
        </div>

        <div class="brand-plate">MODEL CM-9 &middot; iMira</div>
    </div>

    <div id="toast" class="toast-msg"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="common.js"></script>
    <script>
        (function() {
            var actionBtn = document.getElementById('actionBtn');
            var toast = document.getElementById('toast');
            var toastTimer = null;
            var isImpostor = false;
            var isAlive = true;

            function showToast(text, type) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show', 'error', 'success');
                }
                void toast.offsetWidth;
                toast.textContent = text;
                toast.className = 'toast-msg';
                if (type === 'error') toast.classList.add('error');
                else if (type === 'success') toast.classList.add('success');
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2800);
            }

            function handleAction() {
                if (isImpostor) {
                    window.location.href = '/impostor';
                } else {
                    if (!isAlive) {
                        showToast('Oh really?', 'error');
                        return;
                    }
                    actionBtn.disabled = true;
                    socket.emit('im-dead', function(response) {
                        actionBtn.disabled = false;
                        if (response && response.error) {
                            showToast('Error: ' + response.error, 'error');
                        } else {
                            showToast('Death reported', 'success');
                            window.location.href = "/dashboard"

                        }
                    });
                    setTimeout(function() {
                        actionBtn.disabled = false;
                    }, 3000);
                }
            }

            actionBtn.addEventListener('click', handleAction);

            socket.on('player_data_request', function(data) {
                document.getElementById('usr').innerText = data.username || '---';
                document.getElementById('id').innerText = data.id || '---';

                var badge = document.getElementById('alive-badge');
                var shatter = document.getElementById('shatterOverlay');
                isAlive = !!data.alive;
                if (isAlive) {
                    badge.innerText = 'Alive';
                    badge.className = 'status-pill status-alive';
                    shatter.classList.remove('active');
                } else {
                    badge.innerText = 'Dead';
                    badge.className = 'status-pill status-dead';
                    shatter.classList.add('active');
                }

                var completed = data.tasksCompleted || 0;
                var total = data.totalTasks || 0;
                document.getElementById('tasksCompleted').innerText = completed + '/' + total;
                var pct = total > 0 ? Math.min(100, (completed / total) * 100) : 0;
                document.getElementById('personalTaskProgressBar').style.width = pct + '%';

                isImpostor = !!data.impostor;
            });

            socket.on('game_data_request', function(data) {
                var completed = data.completedTasks || 0;
                var total = data.totalTasks || 0;
                document.getElementById('totalTasks').innerText = completed + '/' + total;
                var pct = total > 0 ? Math.min(100, (completed / total) * 100) : 0;
                document.getElementById('taskProgressBar').style.width = pct + '%';

                var meetingEl = document.getElementById('emergencyMeetingStatus');
                if (data.emergencyMeeting) {
                   window.location.href = "/emergency-client"
                }
            });

            socket.on('Err', function(data) {
                console.error('Server error:', data.error);
                showToast('Error: ' + data.error, 'error');
            });

            socket.on('game_over', function(data) {
                window.location.href = '/win';
            });

            if (socket.connected) {
                socket.emit('request_player_data');
            } else {
                socket.once('connect', function() {
                    socket.emit('request_player_data');
                });
            }
        })();
    </script>
</body>
</html>
