<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crewmate Tablet</title>
    <link rel="stylesheet" href="common.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/tabletmap.css">
    <style>
        :root {
            --frame-1: #eef1f5;
            --frame-2: #cfd6df;
            --frame-3: #aab3bf;
            --frame-edge: #7d8695;
            --screen-top: #111821;
            --screen-bottom: #060a0f;
            --screen-text: #e2e8f0;
            --lcd: #5eead4;
            --green: #10b981;
            --red: #ef4444;
            --blue: #3b82f6;
            --paper: #fff176;
            --paper-shade: #fbe44f;
            --ink: #2b2a33;
            --pen: #c62828;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body {
            background-color: #cbd5e1;
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 16px 16px;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
        }

        /* ---------- Tablet ---------- */
        .tablet-wrap { position: relative; width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
        .tablet {
            position: relative;
            width: 100%;
            max-width: 380px;
            padding: 15px;
            border-radius: 34px;
            border: 1px solid var(--frame-edge);
            background: linear-gradient(155deg, var(--frame-1) 0%, var(--frame-2) 50%, var(--frame-3) 100%);
            box-shadow:
                0 22px 40px rgba(15, 23, 42, 0.30),
                0 3px 6px rgba(15, 23, 42, 0.18),
                inset 0 2px 2px rgba(255, 255, 255, 0.8),
                inset 0 -3px 5px rgba(91, 100, 114, 0.35);
        }
        .tablet::before { /* side power button */
            content: "";
            position: absolute;
            right: -3px;
            top: 84px;
            width: 3px;
            height: 46px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(90deg, var(--frame-3), var(--frame-edge));
        }

        .bezel {
            position: relative;
            background: #05070a;
            border-radius: 22px;
            padding: 30px 8px 34px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        .camera {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #3b4a63 0%, #0b1220 55%, #000 100%);
            box-shadow: 0 0 0 2px #0e131b;
        }
        .home-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 84px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.28);
        }

        .screen {
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px 14px 14px;
            border-radius: 10px;
            background: linear-gradient(175deg, var(--screen-top), var(--screen-bottom));
            color: var(--screen-text);
            overflow: hidden;
        }
        .screen > * { position: relative; }
        .screen::after { /* faint glass reflection */
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.05) 0%, transparent 38%);
        }

        .shatter-overlay {
            position: absolute !important;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 5;
        }
        .shatter-overlay.active { opacity: 1; }
        .crack-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        .blood-stain {
            position: absolute;
            mix-blend-mode: multiply;
            filter: blur(0.4px);
            border-radius: 50%;
            background: radial-gradient(ellipse at 35% 30%, rgba(139, 10, 10, 0.9) 0%, rgba(95, 5, 5, 0.75) 55%, rgba(60, 3, 3, 0.45) 80%, transparent 100%);
        }
        .blood-drip {
            position: absolute;
            mix-blend-mode: multiply;
            filter: blur(0.3px);
            border-radius: 40% 40% 20% 20%;
            background: radial-gradient(ellipse at 50% 20%, rgba(139, 10, 10, 0.85) 0%, rgba(80, 5, 5, 0.6) 60%, transparent 100%);
        }

        .screen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #1e293b;
        }
        .screen-header h1 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--blue);
        }
        .status-pill {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
        }
        .status-alive { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
        .status-dead  { background: rgba(239, 68, 68, 0.2);  color: var(--red);   border: 1px solid var(--red); }

        .panel {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
        }
        .info-grid { display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .info-row { display: flex; justify-content: space-between; color: #94a3b8; }
        .info-row span:last-child {
            color: var(--lcd);
            font-weight: 600;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .bar-label span:last-child {
            color: var(--lcd);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }
        .progress-track {
            width: 100%;
            height: 11px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient(90deg, #059669, #10b981);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
            transition: width 0.5s ease;
        }
        .progress-fill.personal {
            background: linear-gradient(90deg, #1d4ed8, #3b82f6);
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
        }

        .emergency-panel { display: flex; justify-content: space-between; align-items: center; }
        .emergency-label { font-size: 0.88rem; font-weight: 600; }
        .meeting-badge { font-size: 0.78rem; font-weight: 800; padding: 5px 11px; border-radius: 8px; }
        .meeting-idle { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid #475569; }
        .meeting-active {
            background: rgba(239, 68, 68, 0.25);
            color: var(--red);
            border: 1px solid var(--red);
            animation: pulse-border 1.2s infinite alternate;
        }
        @keyframes pulse-border {
            from { box-shadow: 0 0 4px rgba(239, 68, 68, 0.4); }
            to   { box-shadow: 0 0 12px rgba(239, 68, 68, 0.9); }
        }

        .btn-action {
            margin-top: auto;
            width: 100%;
            padding: 13px;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            border: 1px solid #7f1d1d;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #7f1d1d, inset 0 1px 1px rgba(255, 255, 255, 0.35);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-action:active { transform: translateY(3px); box-shadow: 0 1px 0 #7f1d1d; }
        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; pointer-events: none; }
        .btn-action:focus-visible { outline: 2px solid #fca5a5; outline-offset: 2px; }

        /* ---------- Sticky note ---------- */
        @property --curl { syntax: "<length>"; inherits: true; initial-value: 84px; }

        .note {
            --curl: 84px;
            position: relative;
            width: 100%;
            max-width: 250px;
            transform: rotate(-2deg);
            -webkit-tap-highlight-color: transparent;
        }
        .note:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }

        .note-sheet {
            position: relative;
            padding: 30px 20px 22px;
            color: var(--ink);
            font-family: "Caveat", "Segoe Print", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.35), transparent 22%),
                linear-gradient(165deg, var(--paper) 0%, var(--paper-shade) 100%);
            border-radius: 2px 2px 14px 2px;
            box-shadow: 0 14px 18px -8px rgba(15, 23, 42, 0.35), 0 2px 3px rgba(15, 23, 42, 0.18);
        }
        .note-sheet::before { /* tape */
            content: "";
            position: absolute;
            top: -11px;
            left: 50%;
            width: 78px;
            height: 22px;
            transform: translateX(-50%) rotate(2deg);
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.15);
        }
        .note-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 6px;
            margin-bottom: 8px;
            border-bottom: 2px solid rgba(43, 42, 51, 0.25);
        }
        .note-head h2 { margin: 0; font-size: 1.7rem; font-weight: 700; line-height: 1; }
        .note-head span { font-size: 1.3rem; font-weight: 700; }

        .note-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; max-height: 50vh; overflow-y: auto; }
        .note-task { display: flex; gap: 10px; align-items: flex-start; line-height: 1.05; }
        .box {
            flex: none;
            width: 17px;
            height: 17px;
            margin-top: 3px;
            border: 2px solid var(--ink);
            border-radius: 3px;
            transform: rotate(-3deg);
        }
        .note-text { font-size: 1.3rem; font-weight: 600; transition: opacity 0.4s ease; }
        .note-name { position: relative; display: inline-block; }
        .note-loc { display: block; font-size: 1.02rem; font-weight: 400; opacity: 0.7; }
        .note-name::after { /* pen stroke */
            content: "";
            position: absolute;
            left: -3px;
            right: -3px;
            top: 52%;
            height: 3px;
            border-radius: 3px;
            background: var(--pen);
            transform: scaleX(0) rotate(-1.2deg);
            transform-origin: left center;
            transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1);
        }
        .note-task.done .note-text { opacity: 0.55; }
        .note-task.done .note-name::after { transform: scaleX(1) rotate(-1.2deg); }
        .note-task.done .box::after { /* tick */
            content: "";
            display: block;
            width: 5px;
            height: 10px;
            margin: -1px 0 0 4px;
            border: solid var(--pen);
            border-width: 0 3px 3px 0;
            transform: rotate(40deg);
        }
        .note-empty { font-size: 1.25rem; opacity: 0.6; }

        /* Handwritten hint on the tablet screen (phones only) */
        .screen-hint { display: none; }

        /* map button on the screen, and "show on map" pins on the sticky note */
        .btn-map {
            display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px;
            font-family: inherit; font-size: 0.92rem; font-weight: 700; color: var(--lcd); text-align: left;
            background: rgba(94, 234, 212, 0.06); border: 1px solid rgba(94, 234, 212, 0.35); border-radius: 12px; cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .btn-map svg { width: 22px; height: 22px; flex: none; }
        .btn-map small { margin-left: auto; color: #8ea0b5; font-weight: 600; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
        .btn-map:active { transform: translateY(1px); background: rgba(94, 234, 212, 0.12); }
        .btn-map:focus-visible { outline: 2px solid var(--lcd); outline-offset: 2px; }
        .note-pin { display: none; flex: none; align-self: center; margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 50%;
            background: rgba(43, 42, 51, 0.1); color: var(--ink); cursor: pointer; padding: 0; place-items: center; }
        .note-pin svg { width: 18px; height: 18px; }
        .has-map .note-pin { display: inline-grid; }
        .note-pin:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

        /* ---- Wide screens: tablet stays dead centre, note hangs off its right side ---- */
        @media (min-width: 860px) {
            .note { position: absolute; left: calc(100% + 40px); top: 90px; transform: rotate(2.5deg); }
        }

        /* ---- Phones: note is folded into the bottom-right corner until tapped ---- */
        @media (max-width: 859px) {
            body { padding-bottom: 100px; }

            .note {
                position: fixed;
                right: 0;
                bottom: 0;
                z-index: 20;
                width: min(270px, calc(100vw - 32px));
                max-width: none;
                cursor: pointer;
                transform-origin: 100% 100%;
                transform: none;
                filter: drop-shadow(0 4px 5px rgba(15, 23, 42, 0.38));
                transition: transform 0.7s cubic-bezier(0.25, 0.8, 0.25, 1);
            }
            .note.open { transform: translate(-14px, -16px) rotate(-2.5deg); }

            .note-sheet {
                box-shadow: none;
                clip-path: polygon(
                    100% calc(100% - var(--curl)),
                    100% calc(100% - var(--curl)),
                    100% 100%,
                    calc(100% - var(--curl)) 100%);
                transition: clip-path 0.7s cubic-bezier(0.35, 0.75, 0.25, 1);
            }
            .note.open .note-sheet {
                clip-path: polygon(-14px -26px, calc(100% + 14px) -26px, calc(100% + 14px) calc(100% + 14px), -14px calc(100% + 14px));
            }

            /* the curl: crease shadow, then the lighter back of the paper */
            .note-sheet::after {
                content: "";
                position: absolute;
                right: 0;
                bottom: 0;
                width: var(--curl);
                height: var(--curl);
                pointer-events: none;
                background: linear-gradient(135deg,
                    rgba(120, 88, 0, 0.45) 50%,
                    rgba(255, 255, 255, 0.55) 60%,
                    rgba(255, 244, 150, 0.1) 100%);
                border-radius: 0 0 14px 0;
                transition: opacity 0.35s ease;
            }
            .note.open .note-sheet::after { opacity: 0; }

            /* a single gentle lift of the corner until the hint has been used */
            .note.nudge:not(.open) .note-sheet { animation: curl-nudge 3.2s ease-in-out 1.2s infinite; }
            @keyframes curl-nudge {
                0%, 62%, 100% { --curl: 84px; }
                72% { --curl: 108px; }
                82% { --curl: 84px; }
                90% { --curl: 98px; }
            }

            .screen-hint {
                display: flex;
                align-items: flex-end;
                justify-content: space-between;
                gap: 8px;
                margin-top: 6px;
                padding: 0 4px;
                font-family: "Caveat", "Segoe Print", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive;
                font-size: 1.5rem;
                line-height: 1;
                color: #fde68a;
                text-shadow: 0 0 10px rgba(253, 230, 138, 0.35);
                transform: rotate(-2.5deg);
                transition: opacity 0.4s ease, transform 0.4s ease, visibility 0s 0.4s;
            }
            .screen-hint svg { flex: none; width: 54px; height: 44px; margin-bottom: -6px; }
            .screen-hint.gone { opacity: 0; visibility: hidden; transform: translateY(6px) rotate(-2.5deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .note-name::after, .progress-fill, .note, .note-sheet { transition: none; }
            .note.nudge:not(.open) .note-sheet { animation: none; }
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(6px);
            color: #e2e8f0;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #334155;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-msg.error { border-color: #ef4444; color: #fca5a5; }
        .toast-msg.success { border-color: #10b981; color: #6ee7b7; }
    </style>
</head>
<body>

    <div class="tablet-wrap">
        <div class="tablet">
            <div class="bezel">
                <div class="camera"></div>
                <div class="screen" data-map-screen>
                    <div class="shatter-overlay" id="shatterOverlay">
                                        <img src="image.jpg" class="crack-overlay" alt="" draggable="false">
                                        <div class="blood-stain" style="top:8%;left:58%;width:30px;height:24px;transform:rotate(12deg)"></div>
                                        <div class="blood-drip" style="top:22%;left:66%;width:4px;height:26px;transform:rotate(6deg)"></div>
                                        <div class="blood-stain" style="top:55%;left:12%;width:20px;height:16px;transform:rotate(-20deg)"></div>
                                        <div class="blood-drip" style="top:62%;left:16%;width:3px;height:18px;transform:rotate(-8deg)"></div>
                                        <div class="blood-stain" style="bottom:6%;right:10%;width:16px;height:13px;transform:rotate(35deg)"></div>
                                        <div class="blood-stain" style="top:15%;left:18%;width:54px;height:42px;transform:rotate(-18deg)"></div>
                                        <div class="blood-stain" style="bottom:18%;left:70%;width:48px;height:36px;transform:rotate(28deg)"></div>
                                        <div class="blood-stain" style="top:42%;right:8%;width:60px;height:48px;transform:rotate(-40deg)"></div>
                                        <div class="blood-stain" style="top:30%;left:42%;width:28px;height:22px;transform:rotate(65deg)"></div>
                                        <div class="blood-stain" style="bottom:28%;right:42%;width:26px;height:20px;transform:rotate(-12deg)"></div>
                                        <div class="blood-stain" style="top:72%;left:36%;width:24px;height:19px;transform:rotate(90deg)"></div>
                                        <div class="blood-stain" style="top:12%;left:24%;width:8px;height:7px;transform:rotate(14deg)"></div>
                                        <div class="blood-stain" style="top:48%;left:76%;width:6px;height:6px;transform:rotate(-15deg)"></div>
                                        <div class="blood-stain" style="bottom:14%;left:48%;width:9px;height:8px;transform:rotate(52deg)"></div>
                                        <div class="blood-stain" style="top:66%;right:18%;width:7px;height:6px;transform:rotate(-75deg)"></div>
                                        <div class="blood-drip" style="top:18%;left:20%;width:5px;height:48px;transform:rotate(-4deg)"></div>
                                        <div class="blood-drip" style="top:34%;right:14%;width:4px;height:40px;transform:rotate(8deg)"></div>
                                        <div class="blood-drip" style="bottom:22%;left:74%;width:6px;height:56px;transform:rotate(-2deg)"></div>
                                        <div class="blood-drip" style="top:26%;left:46%;width:2px;height:14px;transform:rotate(12deg)"></div>
                                        <div class="blood-drip" style="bottom:10%;left:30%;width:3px;height:20px;transform:rotate(-10deg)"></div>
                                        <div class="blood-drip" style="top:58%;right:26%;width:2px;height:16px;transform:rotate(5deg)"></div>
                                    </div>

                    <div class="screen-header">
                        <h1>Crew Terminal</h1>
                        <span id="alive-badge" class="status-pill status-alive">Alive</span>
                    </div>

                    <div class="panel info-grid">
                        <div class="info-row"><span>Username</span><span id="usr">---</span></div>
                        <div class="info-row"><span>Player ID</span><span id="id">---</span></div>
                    </div>

                    <div class="panel">
                        <div class="bar-label"><span>My progress</span><span id="tasksCompleted">0/0</span></div>
                        <div class="progress-track"><div id="personalTaskProgressBar" class="progress-fill personal"></div></div>
                    </div>

                    <div class="panel">
                        <div class="bar-label"><span>Crew progress</span><span id="totalTasks">0/0</span></div>
                        <div class="progress-track"><div id="taskProgressBar" class="progress-fill"></div></div>
                    </div>

                    <button class="btn-map" type="button" data-map-open hidden>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
                        <span>Map</span><small id="mapNext"></small>
                    </button>

                    <div class="panel emergency-panel">
                        <span class="emergency-label">Emergency Meeting</span>
                        <span id="emergencyMeetingStatus" class="meeting-badge meeting-idle">Ready</span>
                    </div>

                    <div class="screen-hint" id="screenHint" aria-hidden="true">
                        <span>psst, crewmate! tap the folded corner to see your tasks</span>
                        <svg viewBox="0 0 54 44" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6 C 22 2, 40 12, 44 34"/><path d="M34 27 L44 36 L48 23"/></svg>
                    </div>

                    <button id="actionBtn" class="btn-action">I'm dead</button>
                </div>
                <div class="home-bar"></div>
            </div>
        </div>

        <aside class="note" id="note" aria-label="My tasks">
            <div class="note-sheet">
                <div class="note-head">
                    <h2>My tasks</h2>
                    <span id="taskListCount">0/0</span>
                </div>
                <ul id="taskList" class="note-list"><li class="note-empty">No tasks yet</li></ul>
            </div>
        </aside>
    </div>

    <div id="toast" class="toast-msg"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="common.js"></script>
    <script type="module" src="/tabletmap.js"></script>
    <script>
        document.addEventListener('tabletmap:ready', function(e) { document.body.classList.toggle('has-map', !!(e.detail && e.detail.hasMap)); });
    </script>
    <script>
        (function() {
            var actionBtn = document.getElementById('actionBtn');
            var toast = document.getElementById('toast');
            var toastTimer = null;
            var isImpostor = false;
            var isAlive = true;

            function showToast(text, type) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    toast.classList.remove('show', 'error', 'success');
                }
                void toast.offsetWidth;
                toast.textContent = text;
                toast.className = 'toast-msg';
                if (type === 'error') toast.classList.add('error');
                else if (type === 'success') toast.classList.add('success');
                toast.classList.add('show');
                toastTimer = setTimeout(function() {
                    toast.classList.remove('show');
                    toastTimer = null;
                }, 2800);
            }

            function handleAction() {
                if (isImpostor) {
                    window.location.href = '/impostor';
                } else {
                    if (!isAlive) {
                        showToast('Oh really?', 'error');
                        return;
                    }
                    actionBtn.disabled = true;
                    socket.emit('im-dead', function(response) {
                        actionBtn.disabled = false;
                        if (response && response.error) {
                            showToast('Error: ' + response.error, 'error');
                        } else {
                            showToast('Death reported', 'success');
                            window.location.href = "/dashboard"

                        }
                    });
                    setTimeout(function() {
                        actionBtn.disabled = false;
                    }, 3000);
                }
            }

            actionBtn.addEventListener('click', handleAction);

            var seenDone = {};
            var firstRender = true;
            var pending = [];          // tasks finished while the note was folded; crossed out when it opens

            var note = document.getElementById('note');
            var hint = document.getElementById('screenHint');
            var mq = window.matchMedia('(max-width: 859px)');
            var HINT_KEY = 'crewTaskHintSeen';
            var hintSeen = false;
            try { hintSeen = localStorage.getItem(HINT_KEY) === '1'; } catch (e) {}
            if (hintSeen) hint.classList.add('gone'); else note.classList.add('nudge');

            function noteFolded() { return mq.matches && !note.classList.contains('open'); }

            function dismissHint() {
                if (hintSeen) return;
                hintSeen = true;
                hint.classList.add('gone');
                note.classList.remove('nudge');
                try { localStorage.setItem(HINT_KEY, '1'); } catch (e) {}
            }

            function setOpen(open) {
                note.classList.toggle('open', open);
                note.setAttribute('aria-expanded', String(open));
                if (open) {
                    dismissHint();
                    // cross out anything finished while it was folded, once the paper has unfolded
                    setTimeout(function() {
                        pending.forEach(function(p) { p.li.classList.add('done'); seenDone[p.key] = true; });
                        pending = [];
                    }, 600);
                }
            }

            function syncMode() {
                if (mq.matches) {
                    note.setAttribute('role', 'button');
                    note.setAttribute('tabindex', '0');
                    note.setAttribute('aria-expanded', String(note.classList.contains('open')));
                    note.setAttribute('aria-label', 'My tasks. Tap to fold or unfold');
                } else {
                    note.removeAttribute('role');
                    note.removeAttribute('tabindex');
                    note.removeAttribute('aria-expanded');
                    note.setAttribute('aria-label', 'My tasks');
                }
            }
            syncMode();
            if (mq.addEventListener) mq.addEventListener('change', syncMode);

            note.addEventListener('click', function() {
                if (mq.matches) setOpen(!note.classList.contains('open'));
            });
            note.addEventListener('keydown', function(e) {
                if (mq.matches && (e.key === 'Enter' || e.key === ' ')) {
                    e.preventDefault();
                    setOpen(!note.classList.contains('open'));
                }
            });
            document.addEventListener('click', function(e) {
                if (mq.matches && note.classList.contains('open') && !note.contains(e.target)) setOpen(false);
            });

            function renderTasks(tasks) {
                var list = document.getElementById('taskList');
                list.innerHTML = '';
                if (!tasks.length) {
                    var empty = document.createElement('li');
                    empty.className = 'note-empty';
                    empty.textContent = 'Nothing to do. Suspicious.';
                    list.appendChild(empty);
                    return;
                }
                var animate = [];
                pending = [];
                tasks.forEach(function(t, i) {
                    var key = (t.id !== undefined ? t.id : t.name + '|' + t.location + '|' + i);
                    var li = document.createElement('li');
                    li.className = 'note-task';
                    var box = document.createElement('span');
                    box.className = 'box';
                    var text = document.createElement('span');
                    text.className = 'note-text';
                    var nm = document.createElement('span');
                    nm.className = 'note-name';
                    nm.textContent = t.name;
                    text.appendChild(nm);
                    if (t.location) {
                        var loc = document.createElement('span');
                        loc.className = 'note-loc';
                        loc.textContent = t.location;
                        text.appendChild(loc);
                    }
                    li.appendChild(box);
                    li.appendChild(text);
                    // "show on map": jumps to where this task's next step is
                    var step = !t.done && t.steps ? t.steps[t.step] : null;
                    if (step && step.pin) {
                        var pin = document.createElement('button');
                        pin.type = 'button';
                        pin.className = 'note-pin';
                        pin.setAttribute('aria-label', 'Show ' + t.name + ' on the map');
                        pin.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>';
                        pin.addEventListener('click', function(ev) {
                            ev.stopPropagation();
                            if (window.TabletMap) window.TabletMap.focusTask(t.id);
                        });
                        li.appendChild(pin);
                    }
                    list.appendChild(li);
                    if (t.done) {
                        // Already crossed out last time (or first load): show it done. Otherwise draw the stroke.
                        if (firstRender || seenDone[key]) li.classList.add('done');
                        else if (noteFolded()) { pending.push({ li: li, key: key }); return; }
                        else animate.push(li);
                    }
                    seenDone[key] = !!t.done;
                });
                firstRender = false;
                if (animate.length) {
                    void list.offsetWidth;
                    requestAnimationFrame(function() {
                        animate.forEach(function(li) { li.classList.add('done'); });
                    });
                }
            }

            socket.on('player_data_request', function(data) {
                if (!data) return;
                document.getElementById('usr').innerText = data.username || '---';
                document.getElementById('id').innerText = data.id || '---';

                var badge = document.getElementById('alive-badge');
                var shatter = document.getElementById('shatterOverlay');
                isAlive = !!data.alive;
                if (isAlive) {
                    badge.innerText = 'Alive';
                    badge.className = 'status-pill status-alive';
                    shatter.classList.remove('active');
                } else {
                    badge.innerText = 'Dead';
                    badge.className = 'status-pill status-dead';
                    shatter.classList.add('active');
                }

                var tasks = Array.isArray(data.tasks) ? data.tasks : [];
                renderTasks(tasks);
                // the map button names where the next task is
                var next = tasks.filter(function(t) { return !t.done; })[0];
                document.getElementById('mapNext').textContent = next ? 'Next: ' + (next.location || next.name) : (tasks.length ? 'All done' : '');
                // Derived from the task list so an impostor's cover tasks look the same as a crewmate's.
                var completed = tasks.length ? tasks.filter(function(t) { return t.done; }).length : (data.tasksCompleted || 0);
                var total = tasks.length || data.totalTasks || 0;
                document.getElementById('taskListCount').innerText = completed + '/' + total;
                document.getElementById('tasksCompleted').innerText = completed + '/' + total;
                var pct = total > 0 ? Math.min(100, (completed / total) * 100) : 0;
                document.getElementById('personalTaskProgressBar').style.width = pct + '%';

                isImpostor = !!data.impostor;
            });

            socket.on('game_data_request', function(data) {
                var completed = data.completedTasks || 0;
                var total = data.totalTasks || 0;
                document.getElementById('totalTasks').innerText = completed + '/' + total;
                var pct = total > 0 ? Math.min(100, (completed / total) * 100) : 0;
                document.getElementById('taskProgressBar').style.width = pct + '%';

                var meetingEl = document.getElementById('emergencyMeetingStatus');
                if (data.emergencyMeeting) {
                   window.location.href = "/emergency-client"
                }
            });

            socket.on("restart_game", function(data){
                window.location.href = "/waiting";
            })

            socket.on('Err', function(data) {
                console.error('Server error:', data.error);
                showToast('Error: ' + data.error, 'error');
            });

            socket.on('game_over', function(data) {
                window.location.href = '/win';
            });

        })();
    </script>
</body>
</html>
